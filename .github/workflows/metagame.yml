name: Metagame data

on:
  schedule:
    # Smogon publishes the previous month's chaos files a few days into the
    # month, so run on days 1-5 at 06:00 UTC until the data is there.
    - cron: "0 6 1-5 * *"
  workflow_dispatch:
    inputs:
      period:
        description: "Period to ingest (YYYY-MM); defaults to the previous month"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest Smogon chaos data
        run: |
          if [ -n "$PERIOD" ]; then
            node scripts/metagame/ingest.ts --period "$PERIOD"
          else
            node scripts/metagame/ingest.ts
          fi
        env:
          PERIOD: ${{ inputs.period }}
          NODE_OPTIONS: --experimental-strip-types
      - name: Format snapshots
        run: npx prettier --write "public/data/metagame/**/*.json"
      - name: Open pull request against dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- public/data/metagame)" ]; then
            echo "Metagame data is up to date; nothing to do."
            exit 0
          fi
          PERIOD=$(jq -r '.latest.doubles | split("/")[3]' public/data/metagame/index.json)
          BRANCH="metagame/data-${PERIOD}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/data/metagame
          git commit -m "chore(data): ingest metagame snapshots for ${PERIOD}"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" > /dev/null 2>&1; then
            echo "Pull request for ${BRANCH} already exists; the force push updated it."
          else
            BODY=$(printf 'Automated monthly ingest of Smogon chaos usage data for %s.\n\nSource: Pokémon Showdown ladder, rating 1630+, via smogon.com/stats.\nGenerated by the metagame workflow (.github/workflows/metagame.yml).' "$PERIOD")
            gh pr create \
              --base dev \
              --head "$BRANCH" \
              --title "chore(data): metagame snapshots for ${PERIOD}" \
              --body "$BODY"
          fi
