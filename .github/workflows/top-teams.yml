name: Top teams data

on:
  schedule:
    # Weekly, Tuesday 04:23 UTC (an off-round minute), well after most
    # weekend tournaments have posted standings.
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest Limitless top teams
        run: node scripts/top-teams/ingest.ts
        env:
          NODE_OPTIONS: --experimental-strip-types
      - name: Format the snapshot
        run: npx prettier --write "public/data/top-teams/**/*.json"
      - name: Open pull request against dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- public/data/top-teams)" ]; then
            echo "Top teams data is up to date; nothing to do."
            exit 0
          fi
          DATE=$(date -u +%F)
          BRANCH="top-teams/data-${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/data/top-teams
          git commit -m "chore(data): ingest top-teams snapshot for ${DATE}"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" > /dev/null 2>&1; then
            echo "Pull request for ${BRANCH} already exists; the force push updated it."
          else
            BODY=$(printf 'Automated weekly ingest of recent Pokémon Champions tournament teams.\n\nSource: the Limitless API (play.limitlesstcg.com); every team links to its Limitless tournament page.\nNo player names or countries are stored — OHKOLab links to the source instead.\nGenerated by the top-teams workflow (.github/workflows/top-teams.yml).' "$DATE")
            gh pr create \
              --base dev \
              --head "$BRANCH" \
              --title "chore(data): top-teams snapshot for ${DATE}" \
              --body "$BODY"
          fi
