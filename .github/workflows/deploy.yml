name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Telemetry: without the Sentry and PostHog keys the build ships
          # with telemetry off. VITE_APP_VERSION tags Sentry events with the
          # commit SHA so they line up with the uploaded source maps.
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          # Image posts (and their legal text) are on only when the repository
          # variable VITE_IMAGE_POSTS is "true".
          VITE_IMAGE_POSTS: ${{ vars.VITE_IMAGE_POSTS }}
          # Direct messages (and their legal text) are on only when the
          # repository variable VITE_DIRECT_MESSAGES is "true".
          VITE_DIRECT_MESSAGES: ${{ vars.VITE_DIRECT_MESSAGES }}
          # SENTRY_AUTH_TOKEN gates the source-map upload plugin in
          # vite.config.ts; SENTRY_ORG and SENTRY_PROJECT target it.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
