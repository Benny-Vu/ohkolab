name: Database

# Builds a fresh local Supabase from supabase/migrations on every change to them,
# then lints the database and checks that every public table has row-level security.
# Catches broken SQL before it reaches the live project.

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  push:
    branches-ignore:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Pinned to the release the 2026-11-20 run passed with: resolving
      # "latest" hits the GitHub API and fails on rate limits
      # (run 44644992101). Bump deliberately, after a green run.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Start a local Supabase and apply all migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime

      - name: Lint the database (plpgsql_check)
        run: supabase db lint --local --level warning --fail-on error

      - name: Every public table has row-level security
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          missing=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -c "
            select coalesce(string_agg(c.relname, ', ' order by c.relname), '')
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r' and not c.relrowsecurity")
          if [ -n "$missing" ]; then
            echo "::error::Tables without RLS: $missing"
            exit 1
          fi
          echo "All public tables have RLS."

      # Exercises the "authors delete their own pending images" policy from
      # 20261120100000_pending_image_delete.sql as a real authenticated user.
      - name: Pending-image delete policy behaviour
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          AUTHOR_ID: 11111111-1111-4111-8111-111111111111
          OTHER_ID: 22222222-2222-4222-8222-222222222222
          POST_ID: 33333333-3333-4333-8333-333333333333
          OWN_PENDING_ID: 44444444-4444-4444-8444-444444444444
          OWN_APPROVED_ID: 55555555-5555-4555-8555-555555555555
          OTHER_PENDING_ID: 66666666-6666-4666-8666-666666666666
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, created_at, updated_at)
          values
            ('11111111-1111-4111-8111-111111111111', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'policy-ci-a@example.com', 'x', now(), now()),
            ('22222222-2222-4222-8222-222222222222', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'policy-ci-b@example.com', 'x', now(), now());
          -- The new-user trigger already made both profiles; just name them.
          insert into public.profiles (id, username) values
            ('11111111-1111-4111-8111-111111111111', 'policy_ci_a'),
            ('22222222-2222-4222-8222-222222222222', 'policy_ci_b')
          on conflict (id) do update set username = excluded.username;
          insert into public.posts (id, author_id, body) values
            ('33333333-3333-4333-8333-333333333333', '11111111-1111-4111-8111-111111111111', 'policy check'),
            ('33333333-3333-4333-8333-333333333334', '22222222-2222-4222-8222-222222222222', 'policy check');
          insert into public.post_images (id, post_id, author_id, position, pending_path, width, height, bytes, status) values
            ('44444444-4444-4444-8444-444444444444', '33333333-3333-4333-8333-333333333333', '11111111-1111-4111-8111-111111111111', 0, '11111111-1111-4111-8111-111111111111/pending.webp', 10, 10, 100, 'pending'),
            ('55555555-5555-4555-8555-555555555555', '33333333-3333-4333-8333-333333333333', '11111111-1111-4111-8111-111111111111', 1, '11111111-1111-4111-8111-111111111111/approved.webp', 10, 10, 100, 'approved'),
            ('66666666-6666-4666-8666-666666666666', '33333333-3333-4333-8333-333333333334', '22222222-2222-4222-8222-222222222222', 0, '22222222-2222-4222-8222-222222222222/pending.webp', 10, 10, 100, 'pending');
          SQL

          # Runs one delete as the author and prints how many rows it removed.
          delete_as_author() {
            # psql only substitutes :'var' in SQL read from stdin, not in -c.
            # -q hides the BEGIN/SET/COMMIT tags so only the count prints.
            psql "$DB_URL" -qtA -v ON_ERROR_STOP=1 -v img="$1" \
              -v claims='{"sub":"11111111-1111-4111-8111-111111111111","role":"authenticated"}' <<'SQL'
          begin;
          set local role authenticated;
          set local request.jwt.claims to :'claims';
          with del as (
            delete from public.post_images where id = :'img' returning 1
          ) select count(*) from del;
          commit;
          SQL
          }

          own_pending=$(delete_as_author "$OWN_PENDING_ID")
          if [ "$own_pending" != "1" ]; then
            echo "::error::Author could not delete their own pending image (got $own_pending)"
            exit 1
          fi
          echo "Author can delete their own pending image."

          own_approved=$(delete_as_author "$OWN_APPROVED_ID")
          if [ "$own_approved" != "0" ]; then
            echo "::error::Author deleted a non-pending image (got $own_approved)"
            exit 1
          fi
          echo "Author cannot delete an approved image."

          foreign_pending=$(delete_as_author "$OTHER_PENDING_ID")
          if [ "$foreign_pending" != "0" ]; then
            echo "::error::Author deleted someone else's image (got $foreign_pending)"
            exit 1
          fi
          echo "Author cannot delete another author's image."

      # Exercises the direct messages migration (20261120110000) as two
      # normal users and a moderator. The accounts are created 4 days old
      # with confirmed emails so start_conversation's account-age rule passes.
      - name: Direct message policies
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Setup, as postgres: six accounts. dm_a and dm_b are adult
          -- friends; dm_teen is 14 (friends-only by the minor rule); dm_c is
          -- an unconnected adult; dm_mod is a moderator. dm_f1..dm_f10 are
          -- adult friends of dm_a for the conversation rate limit.
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, email_confirmed_at, created_at, updated_at)
          values
            ('77777777-7777-4777-8777-777777777777', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-a@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('88888888-8888-4888-8888-888888888888', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-b@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('99999999-9999-4999-8999-999999999999', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-c@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-teen@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-mod@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000001', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f1@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000002', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f2@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000003', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f3@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000004', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f4@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000005', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f5@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000006', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f6@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000007', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f7@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000008', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f8@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000009', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f9@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000010', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f10@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now());

          -- Birth dates: adults 1990, the teen 2012 (14, above the 13 floor).
          insert into public.profile_birth_dates (user_id, birth_date) values
            ('77777777-7777-4777-8777-777777777777', '1990-01-01'),
            ('88888888-8888-4888-8888-888888888888', '1990-01-01'),
            ('99999999-9999-4999-8999-999999999999', '1990-01-01'),
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', '2012-06-01'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', '1990-01-01');
          insert into public.profile_birth_dates (user_id, birth_date)
          select id, '1990-01-01' from public.profiles
          where id::text like 'cccccccc-%';

          insert into public.user_roles (user_id, role)
          values ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', 'moderator');

          -- dm_a and dm_b are friends (mutual follows); dm_a also follows
          -- all ten dm_f users both ways.
          insert into public.follows (follower_id, followee_id) values
            ('77777777-7777-4777-8777-777777777777', '88888888-8888-4888-8888-888888888888'),
            ('88888888-8888-4888-8888-888888888888', '77777777-7777-4777-8777-777777777777');
          insert into public.follows (follower_id, followee_id)
          select '77777777-7777-4777-8777-777777777777', id from public.profiles
          where id::text like 'cccccccc-%';
          insert into public.follows (follower_id, followee_id)
          select id, '77777777-7777-4777-8777-777777777777' from public.profiles
          where id::text like 'cccccccc-%';

          -- The behaviour checks, running as the authenticated role with
          -- each user's claims. Every failure raises with DM-CHECK.
          do $dm$
          declare
            dm_a constant uuid := '77777777-7777-4777-8777-777777777777';
            dm_b constant uuid := '88888888-8888-4888-8888-888888888888';
            dm_c constant uuid := '99999999-9999-4999-8999-999999999999';
            dm_teen constant uuid := 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
            dm_mod constant uuid := 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';
            conv uuid;
            reported uuid;
            friend uuid;
          begin
            set local role authenticated;

            -- dm_a starts a conversation with dm_b and sends a message.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_a, 'role', 'authenticated')::text, true);
            select public.start_conversation(dm_b) into conv;
            if conv is null then
              raise exception 'DM-CHECK: start_conversation returned null';
            end if;
            insert into public.messages (conversation_id, sender_id, body)
            values (conv, dm_a, 'policy check');
            if not exists (select 1 from public.messages where conversation_id = conv) then
              raise exception 'DM-CHECK: message insert failed';
            end if;

            -- The outsider dm_c cannot read the conversation or its messages.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_c, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.conversations where id = conv)
               or exists (select 1 from public.messages where conversation_id = conv) then
              raise exception 'DM-CHECK: outsider read the conversation';
            end if;

            -- The moderator cannot read unreported messages either.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_mod, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.messages where conversation_id = conv) then
              raise exception 'DM-CHECK: moderator read unreported messages';
            end if;

            -- A minor cannot be messaged by a non-friend adult, and the
            -- minor cannot start one either.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_a, 'role', 'authenticated')::text, true);
            begin
              perform public.start_conversation(dm_teen);
              raise exception 'DM-CHECK: adult messaged a non-friend minor';
            exception when others then
              if sqlerrm not like 'You can only message friends%' then
                raise exception 'DM-CHECK: minor rule raised %', sqlerrm;
              end if;
            end;
            perform set_config('request.jwt.claims', json_build_object('sub', dm_teen, 'role', 'authenticated')::text, true);
            begin
              perform public.start_conversation(dm_c);
              raise exception 'DM-CHECK: minor started a conversation with a stranger';
            exception when others then
              if sqlerrm not like 'You can only message friends%' then
                raise exception 'DM-CHECK: minor rule raised %', sqlerrm;
              end if;
            end;

            -- The message rate limit: 20 per minute. dm_a already sent 1,
            -- so 19 more pass and the 21st raises P0A09.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_a, 'role', 'authenticated')::text, true);
            for i in 1..19 loop
              insert into public.messages (conversation_id, sender_id, body)
              values (conv, dm_a, 'rate ' || i);
            end loop;
            begin
              insert into public.messages (conversation_id, sender_id, body)
              values (conv, dm_a, 'one too many');
              raise exception 'DM-CHECK: message rate limit did not fire';
            exception when others then
              if sqlerrm not like 'Sending messages too quickly%' then
                raise exception 'DM-CHECK: message rate limit raised %', sqlerrm;
              end if;
            end;

            -- The conversation rate limit: 10 per 24 hours. dm_a has 1;
            -- nine more pass and the 11th raises P0A08.
            for f in 1..9 loop
              select id into friend from public.profiles
              where id::text = 'cccccccc-0000-4000-8000-0000000000'
                || lpad(f::text, 2, '0');
              perform public.start_conversation(friend);
            end loop;
            select id into friend from public.profiles
            where id::text = 'cccccccc-0000-4000-8000-000000000010';
            begin
              perform public.start_conversation(friend);
              raise exception 'DM-CHECK: conversation rate limit did not fire';
            exception when others then
              if sqlerrm not like 'Too many new conversations today%' then
                raise exception 'DM-CHECK: conversation rate limit raised %', sqlerrm;
              end if;
            end;

            -- Reopening an existing conversation still works at the limit.
            if public.start_conversation(dm_b) is distinct from conv then
              raise exception 'DM-CHECK: reopening a conversation hit the daily limit';
            end if;

            -- Clients can't ask whether another user is an adult.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_c, 'role', 'authenticated')::text, true);
            begin
              perform public.is_adult(dm_teen);
              raise exception 'DM-CHECK: a client could call is_adult';
            exception when insufficient_privilege then
              null;
            end;

            -- Reporting: dm_b reports dm_a's last message; the moderator
            -- can then read the snapshot (all 20 messages: the reported
            -- one plus the 19 before it) but still not the messages table.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_b, 'role', 'authenticated')::text, true);
            select id into reported from public.messages
            where conversation_id = conv and body = 'rate 19';
            perform public.report_message(reported, 'harassment');
            perform set_config('request.jwt.claims', json_build_object('sub', dm_mod, 'role', 'authenticated')::text, true);
            if not exists (
              select 1 from public.message_reports
              where message_id = reported
                and jsonb_array_length(snapshot) = 20
            ) then
              raise exception 'DM-CHECK: report snapshot missing or wrong size';
            end if;
            if exists (select 1 from public.messages where conversation_id = conv) then
              raise exception 'DM-CHECK: moderator read unreported messages after a report';
            end if;

            -- A blocked user cannot send. dm_b blocks dm_a (as dm_b; the
            -- blocks policy only allows blocking as yourself); dm_a's next
            -- message is rejected with the block message.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_b, 'role', 'authenticated')::text, true);
            insert into public.blocks (blocker_id, blocked_id) values (dm_b, dm_a);
            perform set_config('request.jwt.claims', json_build_object('sub', dm_a, 'role', 'authenticated')::text, true);
            begin
              insert into public.messages (conversation_id, sender_id, body)
              values (conv, dm_a, 'still trying');
              raise exception 'DM-CHECK: blocked user sent a message';
            exception when others then
              if sqlerrm not like 'You cannot message this user%' then
                raise exception 'DM-CHECK: block rule raised %', sqlerrm;
              end if;
            end;
          end;
          $dm$;

          -- Account deletion, as postgres: deleting dm_a removes their
          -- conversations and messages, but the reported snapshot stays
          -- for its year.
          do $keep$
          begin
            delete from auth.users where id = '77777777-7777-4777-8777-777777777777';
            if exists (select 1 from public.messages where sender_id = '77777777-7777-4777-8777-777777777777') then
              raise exception 'DM-CHECK: messages survived account deletion';
            end if;
            if not exists (select 1 from public.message_reports where jsonb_array_length(snapshot) = 20) then
              raise exception 'DM-CHECK: the report snapshot was deleted with the account';
            end if;
          end;
          $keep$;
          SQL

      # Exercises the push notifications migration (20261120210000):
      # token and settings policies are per-user, the claim functions batch
      # and cooldown, and account deletion cascades tokens and settings.
      # push_config stays empty here, so the webhook triggers are silent.
      - name: Push notification policies and claims
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, created_at, updated_at)
          values
            ('ffffffff-ffff-4fff-8fff-ffffffffffff', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'push-a@example.com', 'x', now(), now()),
            ('90909090-9090-4909-8909-909090909090', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'push-b@example.com', 'x', now(), now()),
            ('a0a0a0a0-a0a0-4a0a-8a0a-a0a0a0a0a0a0', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'push-c@example.com', 'x', now(), now());
          insert into public.profiles (id, username) values
            ('ffffffff-ffff-4fff-8fff-ffffffffffff', 'push_a'),
            ('90909090-9090-4909-8909-909090909090', 'push_b'),
            ('a0a0a0a0-a0a0-4a0a-8a0a-a0a0a0a0a0a0', 'push_c')
          on conflict (id) do update set username = excluded.username;
          -- Adults, so the message rules treat them as adults (users
          -- without a birth date message friends only).
          insert into public.profile_birth_dates (user_id, birth_date) values
            ('ffffffff-ffff-4fff-8fff-ffffffffffff', '1990-01-01'),
            ('90909090-9090-4909-8909-909090909090', '1990-01-01');

          do $push$
          declare
            push_a constant uuid := 'ffffffff-ffff-4fff-8fff-ffffffffffff';
            push_b constant uuid := '90909090-9090-4909-8909-909090909090';
            push_c constant uuid := 'a0a0a0a0-a0a0-4a0a-8a0a-a0a0a0a0a0a0';
            claimed int;
            push_post uuid;
          begin
            set local role authenticated;

            -- Tokens register through register_push_token() only; the
            -- owner re-registering keeps exactly one row.
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            perform public.register_push_token('fcm-token-shared-1', 'android');
            perform public.register_push_token('fcm-token-shared-1', 'android');
            if (select count(*) from public.push_tokens where user_id = push_a) <> 1 then
              raise exception 'PUSH-CHECK: re-registration duplicated the token row';
            end if;

            -- Direct writes are closed: there is no insert grant.
            begin
              insert into public.push_tokens (user_id, token, platform)
              values (push_a, 'fcm-token-direct', 'android');
              raise exception 'PUSH-CHECK: a direct token insert worked';
            exception when insufficient_privilege then
              null;
            end;

            -- A malformed platform is rejected by the RPC.
            begin
              perform public.register_push_token('fcm-token-bad', 'windows');
              raise exception 'PUSH-CHECK: a bad platform was accepted';
            exception when check_violation then
              null;
            end;

            -- Another user sees none of the owner's tokens and cannot
            -- remove them (verified with the owner's claims, since the
            -- other user cannot even see the row).
            perform set_config('request.jwt.claims', json_build_object('sub', push_b, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.push_tokens where user_id = push_a) then
              raise exception 'PUSH-CHECK: another user read a foreign token';
            end if;
            delete from public.push_tokens where user_id = push_a;
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            if not exists (select 1 from public.push_tokens where user_id = push_a) then
              raise exception 'PUSH-CHECK: another user deleted a foreign token';
            end if;

            -- Shared device: the new user registers the same token and
            -- it moves to them; the previous owner holds it no longer.
            perform set_config('request.jwt.claims', json_build_object('sub', push_b, 'role', 'authenticated')::text, true);
            perform public.register_push_token('fcm-token-shared-1', 'android');
            if not exists (
              select 1 from public.push_tokens
              where token = 'fcm-token-shared-1' and user_id = push_b
            ) then
              raise exception 'PUSH-CHECK: the token did not move to the new user';
            end if;
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            if exists (
              select 1 from public.push_tokens
              where token = 'fcm-token-shared-1' and user_id = push_a
            ) then
              raise exception 'PUSH-CHECK: the previous owner still holds the token';
            end if;

            -- Sign-out on the device: the current owner removes their row.
            perform set_config('request.jwt.claims', json_build_object('sub', push_b, 'role', 'authenticated')::text, true);
            delete from public.push_tokens where user_id = push_b;
            if exists (select 1 from public.push_tokens where user_id = push_b) then
              raise exception 'PUSH-CHECK: the owner could not remove their token';
            end if;

            -- Settings: the owner writes theirs, nobody else sees them.
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            insert into public.push_settings (user_id, enabled) values (push_a, false);
            if not exists (select 1 from public.push_settings where user_id = push_a and enabled = false) then
              raise exception 'PUSH-CHECK: owner cannot write their push settings';
            end if;
            perform set_config('request.jwt.claims', json_build_object('sub', push_b, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.push_settings where user_id = push_a) then
              raise exception 'PUSH-CHECK: another user read foreign push settings';
            end if;
            update public.push_settings set enabled = true where user_id = push_a;
            -- Verified with the owner's claims: the blocked update must
            -- have changed nothing.
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.push_settings where user_id = push_a and enabled = true) then
              raise exception 'PUSH-CHECK: another user changed foreign push settings';
            end if;

            -- A like and a follow both notify push_a (the webhook trigger
            -- is silent: push_config is empty here). The post id comes
            -- from the insert: the authenticated role has no insert grant
            -- on posts.id.
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            insert into public.posts (author_id, body) values
              (push_a, 'push check')
              returning id into push_post;
            perform set_config('request.jwt.claims', json_build_object('sub', push_b, 'role', 'authenticated')::text, true);
            insert into public.post_likes (post_id, user_id) values
              (push_post, push_b);
            insert into public.follows (follower_id, followee_id) values (push_b, push_a);

            reset role;
            -- The claim batches both notifications into one push...
            select count(*) into claimed from public.claim_push_batch(push_a);
            if claimed <> 2 then
              raise exception 'PUSH-CHECK: claim_push_batch returned % rows, expected 2', claimed;
            end if;
            -- ...and the one-minute cooldown makes the next claim empty.
            select count(*) into claimed from public.claim_push_batch(push_a);
            if claimed <> 0 then
              raise exception 'PUSH-CHECK: claim_push_batch ignored the cooldown';
            end if;

            -- A notification arriving inside the cooldown rides with the
            -- next claim instead of pushing on its own.
            set local role authenticated;
            perform set_config('request.jwt.claims', json_build_object('sub', push_c, 'role', 'authenticated')::text, true);
            insert into public.follows (follower_id, followee_id) values (push_c, push_a);
            reset role;
            select count(*) into claimed from public.claim_push_batch(push_a);
            if claimed <> 0 then
              raise exception 'PUSH-CHECK: claim_push_batch pushed inside the cooldown';
            end if;
            if not exists (
              select 1 from public.notifications
              where recipient_id = push_a and pushed_at is null
            ) then
              raise exception 'PUSH-CHECK: a cooldown notification was claimed anyway';
            end if;

            -- Direct messages: the sender's own claim stays empty, the
            -- recipient's claims the row. The conversation is created as
            -- postgres (start_conversation has friend rules); the message
            -- goes in as its real sender.
            insert into public.conversations (id, user_a, user_b, created_by) values
              ('c2c2c2c2-c2c2-4c2c-8c2c-c2c2c2c2c2c2', push_b, push_a, push_b);
            insert into public.conversation_participants (conversation_id, user_id) values
              ('c2c2c2c2-c2c2-4c2c-8c2c-c2c2c2c2c2c2', push_b),
              ('c2c2c2c2-c2c2-4c2c-8c2c-c2c2c2c2c2c2', push_a);
            set local role authenticated;
            perform set_config('request.jwt.claims', json_build_object('sub', push_b, 'role', 'authenticated')::text, true);
            insert into public.messages (conversation_id, sender_id, body)
            values ('c2c2c2c2-c2c2-4c2c-8c2c-c2c2c2c2c2c2', push_b, 'secret message body');
            reset role;
            select count(*) into claimed from public.claim_push_messages(push_b);
            if claimed <> 0 then
              raise exception 'PUSH-CHECK: the sender claimed their own message';
            end if;
            select count(*) into claimed from public.claim_push_messages(push_a);
            if claimed <> 1 then
              raise exception 'PUSH-CHECK: claim_push_messages returned % rows, expected 1', claimed;
            end if;

            -- A final token for push_a so the account-deletion cascade
            -- below has a row to catch.
            set local role authenticated;
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            perform public.register_push_token('fcm-token-a-final', 'android');
          end;
          $push$;

          -- Account deletion cascades the tokens and settings away.
          do $gone$
          begin
            delete from auth.users where id = 'ffffffff-ffff-4fff-8fff-ffffffffffff';
            if exists (select 1 from public.push_tokens where user_id = 'ffffffff-ffff-4fff-8fff-ffffffffffff') then
              raise exception 'PUSH-CHECK: tokens survived account deletion';
            end if;
            if exists (select 1 from public.push_settings where user_id = 'ffffffff-ffff-4fff-8fff-ffffffffffff') then
              raise exception 'PUSH-CHECK: push settings survived account deletion';
            end if;
          end;
          $gone$;
          SQL

      # Exercises the Champions team ID column
      # (20261120200000_team_game_id.sql): the owner reads and writes their
      # own ID, another user sees it only on a public team, and the check
      # constraint rejects malformed IDs.
      - name: Team game ID visibility
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, created_at, updated_at)
          values
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'team-id-a@example.com', 'x', now(), now()),
            ('eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'team-id-b@example.com', 'x', now(), now());
          insert into public.profiles (id, username) values
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd', 'team_id_a'),
            ('eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee', 'team_id_b')
          on conflict (id) do update set username = excluded.username;

          -- The owner's teams: one private, one public, both with an ID.
          -- The other user's team stays private without one.
          insert into public.teams (id, user_id, name, data, is_public, game_team_id) values
            ('12121212-1212-4121-8121-121212121212', 'dddddddd-dddd-4ddd-8ddd-dddddddddddd', 'Private team', '[]'::jsonb, false, 'AbCd123456'),
            ('13131313-1313-4131-8131-131313131313', 'dddddddd-dddd-4ddd-8ddd-dddddddddddd', 'Public team', '[]'::jsonb, true, 'EfGh456789');

          -- Behaviour checks, as the authenticated role with each user's
          -- claims. Every failure raises with TEAM-ID-CHECK.
          do $team$
          declare
            owner constant uuid := 'dddddddd-dddd-4ddd-8ddd-dddddddddddd';
            other constant uuid := 'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee';
            private_team constant uuid := '12121212-1212-4121-8121-121212121212';
            public_team constant uuid := '13131313-1313-4131-8131-131313131313';
          begin
            set local role authenticated;

            -- The owner reads and updates their own private team's ID.
            perform set_config('request.jwt.claims', json_build_object('sub', owner, 'role', 'authenticated')::text, true);
            if not exists (
              select 1 from public.teams
              where id = private_team and game_team_id = 'AbCd123456'
            ) then
              raise exception 'TEAM-ID-CHECK: owner cannot read their private team''s ID';
            end if;
            update public.teams set game_team_id = 'ZzYx987654' where id = private_team;
            if not exists (
              select 1 from public.teams
              where id = private_team and game_team_id = 'ZzYx987654'
            ) then
              raise exception 'TEAM-ID-CHECK: owner cannot update their team''s ID';
            end if;

            -- Another user cannot read the private team at all, so its ID
            -- never reaches them.
            perform set_config('request.jwt.claims', json_build_object('sub', other, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.teams where id = private_team) then
              raise exception 'TEAM-ID-CHECK: another user read a private team';
            end if;

            -- The same user reads the public team's ID.
            if not exists (
              select 1 from public.teams
              where id = public_team and game_team_id = 'EfGh456789'
            ) then
              raise exception 'TEAM-ID-CHECK: public team ID unreadable';
            end if;
          end;
          $team$;

          -- The check constraint rejects malformed IDs (as postgres).
          do $shape$
          begin
            begin
              insert into public.teams (id, user_id, name, data, game_team_id)
              values ('14141414-1414-4141-8141-141414141414',
                      'dddddddd-dddd-4ddd-8ddd-dddddddddddd', 'Bad', '[]'::jsonb, 'short');
              raise exception 'TEAM-ID-CHECK: a malformed ID was accepted';
            exception when check_violation then
              null;
            end;
          end;
          $shape$;
          SQL

      # Exercises the community wave (20261121200000): the new profile
      # fields are public but only the owner writes them, URL and enum
      # checks fire, and posts/groups accept and expose their tags.
      - name: Community profile fields and tags
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, created_at, updated_at)
          values
            ('d1d1d1d1-d1d1-4d1d-8d1d-d1d1d1d1d1d1', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'comm-a@example.com', 'x', now(), now()),
            ('e2e2e2e2-e2e2-4e2e-8e2e-e2e2e2e2e2e2', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'comm-b@example.com', 'x', now(), now());
          insert into public.profiles (id, username) values
            ('d1d1d1d1-d1d1-4d1d-8d1d-d1d1d1d1d1d1', 'comm_a'),
            ('e2e2e2e2-e2e2-4e2e-8e2e-e2e2e2e2e2e2', 'comm_b')
          on conflict (id) do update set username = excluded.username;

          do $comm$
          declare
            comm_a constant uuid := 'd1d1d1d1-d1d1-4d1d-8d1d-d1d1d1d1d1d1';
            comm_b constant uuid := 'e2e2e2e2-e2e2-4e2e-8e2e-e2e2e2e2e2e2';
          begin
            set local role authenticated;

            -- The owner fills in every new field.
            perform set_config('request.jwt.claims', json_build_object('sub', comm_a, 'role', 'authenticated')::text, true);
            -- 'singles', not 'doubles': the follow-suggestions step below
            -- gives its viewer 'doubles', and a shared main_format would
            -- leak this user into that step's exact-ranking assertion.
            update public.profiles set
              main_format = 'singles',
              looking_for = 'practice partners',
              youtube_url = 'https://youtube.com/@example',
              twitch_url = 'https://twitch.tv/example',
              showdown_name = 'example'
            where id = comm_a;
            if not exists (
              select 1 from public.profiles
              where id = comm_a
                and main_format = 'singles'
                and looking_for = 'practice partners'
                and youtube_url = 'https://youtube.com/@example'
                and showdown_name = 'example'
            ) then
              raise exception 'COMM-CHECK: owner cannot write the new profile fields';
            end if;

            -- The enum and https checks fire.
            begin
              update public.profiles set main_format = 'triples' where id = comm_a;
              raise exception 'COMM-CHECK: a bad main_format was accepted';
            exception when check_violation then
              null;
            end;
            begin
              update public.profiles set youtube_url = 'http://insecure.example' where id = comm_a;
              raise exception 'COMM-CHECK: a non-https link was accepted';
            exception when check_violation then
              null;
            end;

            -- Anyone reads the fields; nobody else writes them.
            perform set_config('request.jwt.claims', json_build_object('sub', comm_b, 'role', 'authenticated')::text, true);
            if not exists (
              select 1 from public.profiles
              where id = comm_a and looking_for = 'practice partners'
            ) then
              raise exception 'COMM-CHECK: the new fields are not public';
            end if;
            update public.profiles set looking_for = 'hijacked' where id = comm_a;
            perform set_config('request.jwt.claims', json_build_object('sub', comm_a, 'role', 'authenticated')::text, true);
            if exists (
              select 1 from public.profiles
              where id = comm_a and looking_for = 'hijacked'
            ) then
              raise exception 'COMM-CHECK: another user changed the profile fields';
            end if;

            -- Posts: the author tags a language, and only the author may
            -- change it.
            perform set_config('request.jwt.claims', json_build_object('sub', comm_a, 'role', 'authenticated')::text, true);
            insert into public.posts (author_id, body, language)
            values (comm_a, 'community check', 'ja');
            if not exists (
              select 1 from public.posts
              where author_id = comm_a and language = 'ja'
            ) then
              raise exception 'COMM-CHECK: the post language tag did not save';
            end if;
            begin
              insert into public.posts (author_id, body, language)
              values (comm_a, 'bad tag', 'fr');
              raise exception 'COMM-CHECK: a bad post language was accepted';
            exception when check_violation then
              null;
            end;
            update public.posts set language = 'en' where author_id = comm_a;
            if not exists (
              select 1 from public.posts where author_id = comm_a and language = 'en'
            ) then
              raise exception 'COMM-CHECK: the author could not retag their post';
            end if;
            perform set_config('request.jwt.claims', json_build_object('sub', comm_b, 'role', 'authenticated')::text, true);
            update public.posts set language = 'ja' where author_id = comm_a;
            perform set_config('request.jwt.claims', json_build_object('sub', comm_a, 'role', 'authenticated')::text, true);
            if exists (
              select 1 from public.posts where author_id = comm_a and language = 'ja'
            ) then
              raise exception 'COMM-CHECK: another user retagged the post';
            end if;

            -- Groups: the owner sets a category and language; the checks
            -- fire; the tags are public.
            insert into public.groups (slug, name, owner_id, category, language)
            values ('community-check', 'Community check', comm_a, 'team_building', 'ja');
            if not exists (
              select 1 from public.groups
              where slug = 'community-check'
                and category = 'team_building' and language = 'ja'
            ) then
              raise exception 'COMM-CHECK: the group tags did not save';
            end if;
            begin
              update public.groups set category = 'casual' where slug = 'community-check';
              raise exception 'COMM-CHECK: a bad group category was accepted';
            exception when check_violation then
              null;
            end;
            perform set_config('request.jwt.claims', json_build_object('sub', comm_b, 'role', 'authenticated')::text, true);
            if not exists (
              select 1 from public.groups
              where slug = 'community-check' and category = 'team_building'
            ) then
              raise exception 'COMM-CHECK: the group tags are not public';
            end if;
          end;
          $comm$;
          SQL

      # Exercises the follow-suggestions RPC (20261121210000) as two
      # authenticated users: the viewer never sees themself, anyone they
      # already follow, a blocked user or a suspended user, and the
      # mutual-follow + shared-group candidate outranks the rest.
      - name: Follow suggestions ranking and exclusions
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, created_at, updated_at)
          values
            ('3f3f3f3f-3f3f-43f3-83f3-3f3f3f3f3f3f', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'fs-a@example.com', 'x', now(), now()),
            ('4e4e4e4e-4e4e-44e4-84e4-4e4e4e4e4e4e', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'fs-bridge@example.com', 'x', now(), now()),
            ('5d5d5d5d-5d5d-45d5-85d5-5d5d5d5d5d5d', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'fs-shared@example.com', 'x', now(), now()),
            ('6c6c6c6c-6c6c-46c6-86c6-6c6c6c6c6c6c', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'fs-conn@example.com', 'x', now(), now()),
            ('7b7b7b7b-7b7b-47b7-87b7-7b7b7b7b7b7b', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'fs-format@example.com', 'x', now(), now()),
            ('8a8a8a8a-8a8a-48a8-8a8a-8a8a8a8a8a8a', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'fs-followed@example.com', 'x', now(), now()),
            ('91919191-9191-4919-8919-919191919191', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'fs-blocked@example.com', 'x', now(), now()),
            ('92929292-9292-4929-8929-929292929292', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'fs-suspended@example.com', 'x', now(), now()),
            ('93939393-9393-4939-8939-939393939393', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'fs-minor@example.com', 'x', now(), now());
          insert into public.profiles (id, username) values
            ('93939393-9393-4939-8939-939393939393', 'fs_minor'),
            ('3f3f3f3f-3f3f-43f3-83f3-3f3f3f3f3f3f', 'fs_a'),
            ('4e4e4e4e-4e4e-44e4-84e4-4e4e4e4e4e4e', 'fs_bridge'),
            ('5d5d5d5d-5d5d-45d5-85d5-5d5d5d5d5d5d', 'fs_shared'),
            ('6c6c6c6c-6c6c-46c6-86c6-6c6c6c6c6c6c', 'fs_conn'),
            ('7b7b7b7b-7b7b-47b7-87b7-7b7b7b7b7b7b', 'fs_format'),
            ('8a8a8a8a-8a8a-48a8-8a8a-8a8a8a8a8a8a', 'fs_followed'),
            ('91919191-9191-4919-8919-919191919191', 'fs_blocked'),
            ('92929292-9292-4929-8929-929292929292', 'fs_suspended')
          on conflict (id) do update set username = excluded.username;
          -- Everyone is an adult except fs_minor (17): suggestions only
          -- ever show adults.
          insert into public.profile_birth_dates (user_id, birth_date)
          select id, '1990-01-01' from public.profiles
          where username like 'fs\_%' and username <> 'fs_minor'
          on conflict (user_id) do nothing;
          insert into public.profile_birth_dates (user_id, birth_date)
          values ('93939393-9393-4939-8939-939393939393', current_date - interval '17 years')
          on conflict (user_id) do nothing;
          update public.profiles set main_format = 'doubles'
          where id in ('3f3f3f3f-3f3f-43f3-83f3-3f3f3f3f3f3f', '7b7b7b7b-7b7b-47b7-87b7-7b7b7b7b7b7b', '93939393-9393-4939-8939-939393939393');
          update public.profiles set display_name = 'Format Fan', avatar_species = 'Garchomp'
          where id = '7b7b7b7b-7b7b-47b7-87b7-7b7b7b7b7b7b';

          -- The graph: fs_a follows the bridge and one more user; the
          -- bridge follows the shared-group user, the connection-only user
          -- and the suspended user. fs_a blocks fs_blocked.
          insert into public.follows (follower_id, followee_id) values
            ('3f3f3f3f-3f3f-43f3-83f3-3f3f3f3f3f3f', '4e4e4e4e-4e4e-44e4-84e4-4e4e4e4e4e4e'),
            ('3f3f3f3f-3f3f-43f3-83f3-3f3f3f3f3f3f', '8a8a8a8a-8a8a-48a8-8a8a-8a8a8a8a8a8a'),
            ('4e4e4e4e-4e4e-44e4-84e4-4e4e4e4e4e4e', '5d5d5d5d-5d5d-45d5-85d5-5d5d5d5d5d5d'),
            ('4e4e4e4e-4e4e-44e4-84e4-4e4e4e4e4e4e', '6c6c6c6c-6c6c-46c6-86c6-6c6c6c6c6c6c'),
            ('4e4e4e4e-4e4e-44e4-84e4-4e4e4e4e4e4e', '92929292-9292-4929-8929-929292929292'),
            -- The bridge also follows the minor: a strong signal that must
            -- still never surface them.
            ('4e4e4e4e-4e4e-44e4-84e4-4e4e4e4e4e4e', '93939393-9393-4939-8939-939393939393');
          insert into public.groups (slug, name, owner_id) values
            ('fs-shared-group', 'Follow Check Group', '3f3f3f3f-3f3f-43f3-83f3-3f3f3f3f3f3f');
          -- fs_a owns the group, so the groups_add_owner trigger already
          -- made them a member; only fs_shared needs an explicit row.
          insert into public.group_members (group_id, user_id, status)
          select g.id, p.id, 'active'
          from public.groups g, public.profiles p
          where g.slug = 'fs-shared-group'
            and p.username in ('fs_shared');
          insert into public.blocks (blocker_id, blocked_id) values
            ('3f3f3f3f-3f3f-43f3-83f3-3f3f3f3f3f3f', '91919191-9191-4919-8919-919191919191');
          insert into public.user_suspensions (user_id, "until", reason) values
            ('92929292-9292-4929-8929-929292929292', now() + interval '1 day', 'CI suspension check');

          -- Behaviour checks, as the authenticated role with each user's
          -- claims. Every failure raises with FS-CHECK.
          do $fs$
          declare
            fs_a constant uuid := '3f3f3f3f-3f3f-43f3-83f3-3f3f3f3f3f3f';
            fs_followed constant uuid := '8a8a8a8a-8a8a-48a8-8a8a-8a8a8a8a8a8a';
            excluded_seen int;
            suggested text[];
          begin
            set local role authenticated;

            -- User A: the RPC excludes themself, both already-followed
            -- users, the blocked user and the suspended user.
            perform set_config('request.jwt.claims', json_build_object('sub', fs_a, 'role', 'authenticated')::text, true);
            select count(*) into excluded_seen
            from public.suggest_users(10) s
            where s.id in (
              '3f3f3f3f-3f3f-43f3-83f3-3f3f3f3f3f3f',
              '4e4e4e4e-4e4e-44e4-84e4-4e4e4e4e4e4e',
              '8a8a8a8a-8a8a-48a8-8a8a-8a8a8a8a8a8a',
              '91919191-9191-4919-8919-919191919191',
              '92929292-9292-4929-8929-929292929292',
              '93939393-9393-4939-8939-939393939393'
            );
            if excluded_seen <> 0 then
              raise exception 'FS-CHECK: % excluded users were suggested', excluded_seen;
            end if;

            -- The ranking: shared group + connection first, connection
            -- second, same main format third.
            select array_agg(s.username order by s.score desc, s.username) into suggested
            from public.suggest_users(10) s;
            if suggested is distinct from array['fs_shared', 'fs_conn', 'fs_format'] then
              raise exception 'FS-CHECK: ranking was %, expected {fs_shared,fs_conn,fs_format}', suggested;
            end if;

            -- The scores are the weighted sums (3 per connection, 2 per
            -- shared group, 1 for the same main format).
            if not exists (
              select 1 from public.suggest_users(10) s
              where s.username = 'fs_shared' and s.score = 5
            ) or not exists (
              select 1 from public.suggest_users(10) s
              where s.username = 'fs_format' and s.score = 1
            ) then
              raise exception 'FS-CHECK: the scores are not the weighted sums';
            end if;

            -- The result exposes the public profile fields plus the score.
            if not exists (
              select 1 from public.suggest_users(10) s
              where s.username = 'fs_format'
                and s.display_name = 'Format Fan'
                and s.avatar_species = 'Garchomp'
                and s.main_format = 'doubles'
            ) then
              raise exception 'FS-CHECK: the public profile fields are missing';
            end if;

            -- User B (a second authenticated user) has no signals at all:
            -- no followees, no groups, no format: the RPC returns nothing.
            perform set_config('request.jwt.claims', json_build_object('sub', fs_followed, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.suggest_users(10) s) then
              raise exception 'FS-CHECK: a signal-less user got suggestions';
            end if;
          end;
          $fs$;
          SQL

      # Exercises the battle requests migration (20261122200000): visibility
      # (blocks and minors), the offer/accept/decline flow, the in-game code
      # seen only by the matched pair, rate limits, expiry and reports.
      - name: Battle request policies
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, email_confirmed_at, created_at, updated_at)
          values
            ('a5a5a5a5-a5a5-45a5-85a5-a5a5a5a5a5a5', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'bat-a@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('b6b6b6b6-b6b6-46b6-86b6-b6b6b6b6b6b6', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'bat-b@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('c7c7c7c7-c7c7-47c7-87c7-c7c7c7c7c7c7', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'bat-c@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('d8d8d8d8-d8d8-48d8-88d8-d8d8d8d8d8d8', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'bat-teen@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('e9e9e9e9-e9e9-49e9-89e9-e9e9e9e9e9e9', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'bat-blocked@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('f0f0f0f0-f0f0-40f0-80f0-f0f0f0f0f0f0', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'bat-dm@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('5a5a5a5a-5a5a-45a5-85a5-5a5a5a5a5a5a', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'bat-mod@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now());
          insert into public.profiles (id, username) values
            ('a5a5a5a5-a5a5-45a5-85a5-a5a5a5a5a5a5', 'bat_a'),
            ('b6b6b6b6-b6b6-46b6-86b6-b6b6b6b6b6b6', 'bat_b'),
            ('c7c7c7c7-c7c7-47c7-87c7-c7c7c7c7c7c7', 'bat_c'),
            ('d8d8d8d8-d8d8-48d8-88d8-d8d8d8d8d8d8', 'bat_teen'),
            ('e9e9e9e9-e9e9-49e9-89e9-e9e9e9e9e9e9', 'bat_blocked'),
            ('f0f0f0f0-f0f0-40f0-80f0-f0f0f0f0f0f0', 'bat_dm'),
            ('5a5a5a5a-5a5a-45a5-85a5-5a5a5a5a5a5a', 'bat_mod')
          on conflict (id) do update set username = excluded.username;
          -- Everyone is an adult except bat_teen (14): battle content is
          -- friends-only for minors, mirroring the messaging rules.
          insert into public.profile_birth_dates (user_id, birth_date)
          values
            ('a5a5a5a5-a5a5-45a5-85a5-a5a5a5a5a5a5', '1990-01-01'),
            ('b6b6b6b6-b6b6-46b6-86b6-b6b6b6b6b6b6', '1990-01-01'),
            ('c7c7c7c7-c7c7-47c7-87c7-c7c7c7c7c7c7', '1990-01-01'),
            ('d8d8d8d8-d8d8-48d8-88d8-d8d8d8d8d8d8', '2012-06-01'),
            ('e9e9e9e9-e9e9-49e9-89e9-e9e9e9e9e9e9', '1990-01-01'),
            ('f0f0f0f0-f0f0-40f0-80f0-f0f0f0f0f0f0', '1990-01-01'),
            ('5a5a5a5a-5a5a-45a5-85a5-5a5a5a5a5a5a', '1990-01-01');
          insert into public.user_roles (user_id, role)
          values ('5a5a5a5a-5a5a-45a5-85a5-5a5a5a5a5a5a', 'moderator');
          -- bat_a and bat_b are friends, so the main accept flow opens a
          -- DM thread; bat_c accepts messages from nobody, so a match with
          -- bat_c falls back to the in-game code inside the request.
          insert into public.follows (follower_id, followee_id) values
            ('a5a5a5a5-a5a5-45a5-85a5-a5a5a5a5a5a5', 'b6b6b6b6-b6b6-46b6-86b6-b6b6b6b6b6b6'),
            ('b6b6b6b6-b6b6-46b6-86b6-b6b6b6b6b6b6', 'a5a5a5a5-a5a5-45a5-85a5-a5a5a5a5a5a5');
          update public.message_settings set who_can_message = 'nobody'
          where user_id = 'c7c7c7c7-c7c7-47c7-87c7-c7c7c7c7c7c7';
          -- bat_a blocks bat_blocked.
          insert into public.blocks (blocker_id, blocked_id) values
            ('a5a5a5a5-a5a5-45a5-85a5-a5a5a5a5a5a5', 'e9e9e9e9-e9e9-49e9-89e9-e9e9e9e9e9e9');
          -- bat_a's public and private teams (the team rule).
          insert into public.teams (id, user_id, name, data, is_public) values
            ('62626262-6262-4626-8262-626262626262', 'a5a5a5a5-a5a5-45a5-85a5-a5a5a5a5a5a5', 'Public team', '[]'::jsonb, true),
            ('63636363-6363-4636-8363-636363636363', 'a5a5a5a5-a5a5-45a5-85a5-a5a5a5a5a5a5', 'Private team', '[]'::jsonb, false);
          -- 31 back-dated open requests by bat_c (outside the 24-hour
          -- request rate window, still open until the cron runs). bat_blocked
          -- has 30 back-dated replies on the first 30, so the reply rate
          -- limit has one spare request left to fail on.
          insert into public.battle_requests (id, author_id, format, rules, language, created_at)
          select gen_random_uuid(), 'c7c7c7c7-c7c7-47c7-87c7-c7c7c7c7c7c7',
                 'doubles', 'casual', 'en', now() - interval '25 hours'
          from generate_series(1, 31);
          -- The reply seed runs with bat_blocked's claims: the reply
          -- trigger's helpers answer only for the caller, and without
          -- claims there is no caller.
          begin;
          select set_config(
            'request.jwt.claims',
            json_build_object(
              'sub', 'e9e9e9e9-e9e9-49e9-89e9-e9e9e9e9e9e9',
              'role', 'authenticated'
            )::text,
            true
          );
          insert into public.battle_replies (request_id, responder_id, created_at)
          select r.id, 'e9e9e9e9-e9e9-49e9-89e9-e9e9e9e9e9e9', now() - interval '2 hours'
          from (
            select id from public.battle_requests
            where author_id = 'c7c7c7c7-c7c7-47c7-87c7-c7c7c7c7c7c7'
            order by created_at
            limit 30
          ) r;
          commit;

          -- Behaviour checks, as the authenticated role with each user's
          -- claims. Every failure raises with BAT-CHECK.
          do $bat$
          declare
            bat_a constant uuid := 'a5a5a5a5-a5a5-45a5-85a5-a5a5a5a5a5a5';
            bat_b constant uuid := 'b6b6b6b6-b6b6-46b6-86b6-b6b6b6b6b6b6';
            bat_c constant uuid := 'c7c7c7c7-c7c7-47c7-87c7-c7c7c7c7c7c7';
            bat_teen constant uuid := 'd8d8d8d8-d8d8-48d8-88d8-d8d8d8d8d8d8';
            bat_blocked constant uuid := 'e9e9e9e9-e9e9-49e9-89e9-e9e9e9e9e9e9';
            bat_dm constant uuid := 'f0f0f0f0-f0f0-40f0-80f0-f0f0f0f0f0f0';
            bat_mod constant uuid := '5a5a5a5a-5a5a-45a5-85a5-5a5a5a5a5a5a';
            public_team constant uuid := '62626262-6262-4626-8262-626262626262';
            private_team constant uuid := '63636363-6363-4636-8363-636363636363';
            req_main uuid;
            req_minor uuid;
            req_fallback uuid;
            req_blocked uuid;
            reply_main uuid;
            reply_fallback uuid;
            reply_c uuid;
            reply_teen uuid;
            reply_blocked uuid;
            conv uuid;
            old_request uuid;
          begin
            set local role authenticated;

            -- bat_a posts the main request with their public team and a
            -- window; bat_b can see it.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            -- The inserts look exactly like the client's (the granted
            -- columns only), so the fixed ids the old draft used are gone;
            -- later assertions use the captured variables instead.
            insert into public.battle_requests (author_id, format, rules, note, starts_at, ends_at, timezone, language, team_id)
            values (bat_a, 'doubles', 'Reg M-C, best of 3', 'looking for a close one', now() + interval '2 hours', now() + interval '6 hours', 'Europe/Oslo', 'en', public_team)
            returning id into req_main;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_b, 'role', 'authenticated')::text, true);
            if not exists (select 1 from public.battle_requests where id = req_main and team_id = public_team) then
              raise exception 'BAT-CHECK: the request with its team is not visible';
            end if;

            -- A past window, a foreign team and a private team are all
            -- rejected by the insert trigger.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            begin
              insert into public.battle_requests (author_id, format, rules, language, ends_at)
              values (bat_a, 'doubles', 'bad window', 'en', now() - interval '1 hour');
              raise exception 'BAT-CHECK: a past window was accepted';
            exception when check_violation then
              null;
            end;
            begin
              insert into public.battle_requests (author_id, format, rules, language, team_id)
              values (bat_a, 'doubles', 'foreign team', 'en', '12121212-1212-4121-8121-121212121212');
              raise exception 'BAT-CHECK: a foreign team was accepted';
            exception when check_violation then
              null;
            end;
            begin
              insert into public.battle_requests (author_id, format, rules, language, team_id)
              values (bat_a, 'doubles', 'private team', 'en', private_team);
              raise exception 'BAT-CHECK: a private team was accepted';
            exception when check_violation then
              null;
            end;

            -- The blocked user sees nothing of bat_a's requests and their
            -- offer never lands.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_blocked, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.battle_requests where id = req_main) then
              raise exception 'BAT-CHECK: a blocked user saw the request';
            end if;
            begin
              insert into public.battle_replies (request_id, responder_id)
              values (req_main, bat_blocked);
            exception when others then
              null;
            end;
            if exists (
              select 1 from public.battle_replies
              where request_id = req_main and responder_id = bat_blocked
            ) then
              raise exception 'BAT-CHECK: a blocked user offered';
            end if;

            -- The minor sees and answers friends only. bat_teen is not
            -- friends with bat_a yet: no request in either direction.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_teen, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.battle_requests where id = req_main) then
              raise exception 'BAT-CHECK: a minor saw a non-friend request';
            end if;
            insert into public.battle_requests (author_id, format, rules, language)
            values (bat_teen, 'singles', 'casual', 'ja')
            returning id into req_minor;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.battle_requests where id = req_minor) then
              raise exception 'BAT-CHECK: an adult saw a non-friend minor''s request';
            end if;

            -- bat_b offers on the main request; the author is notified.
            -- The notification row belongs to the author, so only postgres
            -- can read it back (the recipient-only RLS policy).
            perform set_config('request.jwt.claims', json_build_object('sub', bat_b, 'role', 'authenticated')::text, true);
            insert into public.battle_replies (request_id, responder_id)
            values (req_main, bat_b)
            returning id into reply_main;
            reset role;
            if not exists (
              select 1 from public.notifications
              where recipient_id = bat_a and actor_id = bat_b
                and type = 'battle' and battle_request_id = req_main
            ) then
              raise exception 'BAT-CHECK: the author was not notified of the offer';
            end if;
            set local role authenticated;

            -- Withdraw: the responder takes their pending offer back.
            update public.battle_replies set status = 'withdrawn' where id = reply_main;
            if not exists (
              select 1 from public.battle_replies
              where id = reply_main and status = 'withdrawn'
            ) then
              raise exception 'BAT-CHECK: the responder could not withdraw';
            end if;

            -- The request rate limit: 5 open per author per 24 hours.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            for i in 1..4 loop
              insert into public.battle_requests (author_id, format, rules, language)
              values (bat_a, 'doubles', 'filler ' || i, 'en');
            end loop;
            begin
              insert into public.battle_requests (author_id, format, rules, language)
              values (bat_a, 'doubles', 'one too many', 'en');
              raise exception 'BAT-CHECK: the request rate limit did not fire';
            exception when others then
              if sqlerrm not like 'Too many open battle requests%' then
                raise exception 'BAT-CHECK: request rate limit raised %', sqlerrm;
              end if;
            end;

            -- The reply rate limit: 30 replies per responder per 24 hours.
            -- bat_blocked has 30 back-dated replies; the spare request
            -- makes the 31st offer fail.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_blocked, 'role', 'authenticated')::text, true);
            begin
              insert into public.battle_replies (request_id, responder_id)
              select r.id, bat_blocked
              from (
                select id from public.battle_requests
                where author_id = bat_c and status = 'open'
                order by created_at desc
                limit 1
              ) r;
              raise exception 'BAT-CHECK: the reply rate limit did not fire';
            exception when others then
              if sqlerrm not like 'Too many battle offers today%' then
                raise exception 'BAT-CHECK: reply rate limit raised %', sqlerrm;
              end if;
            end;

            -- bat_dm posts and bat_c (who accepts messages from nobody)
            -- offers; accepting still matches, but the messaging rules
            -- forbid the thread: the pair falls back to the code field.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_dm, 'role', 'authenticated')::text, true);
            insert into public.battle_requests (author_id, format, rules, language)
            values (bat_dm, 'singles', 'Reg M-C', 'en')
            returning id into req_fallback;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_c, 'role', 'authenticated')::text, true);
            insert into public.battle_replies (request_id, responder_id)
            values (req_fallback, bat_c)
            returning id into reply_fallback;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_dm, 'role', 'authenticated')::text, true);
            select public.accept_battle_reply(reply_fallback) into conv;
            if conv is not null then
              raise exception 'BAT-CHECK: a forbidden DM was opened anyway';
            end if;
            if not exists (select 1 from public.battle_requests where id = req_fallback and status = 'matched') then
              raise exception 'BAT-CHECK: the fallback match did not happen';
            end if;

            -- The main flow: bat_b re-offers (the withdraw freed their
            -- slot), bat_teen (now friends with bat_a) and bat_c offer too;
            -- nobody but the author can accept; accepting matches, opens
            -- the DM, declines the others and notifies the responder.
            -- bat_b re-offers: the withdrawn row is reactivated in place
            -- (returning would capture nothing, so no returning here).
            perform set_config('request.jwt.claims', json_build_object('sub', bat_b, 'role', 'authenticated')::text, true);
            insert into public.battle_replies (request_id, responder_id)
            values (req_main, bat_b);
            if not exists (
              select 1 from public.battle_replies
              where id = reply_main and status = 'pending'
            ) then
              raise exception 'BAT-CHECK: the withdrawn offer was not reactivated';
            end if;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_c, 'role', 'authenticated')::text, true);
            insert into public.battle_replies (request_id, responder_id)
            values (req_main, bat_c)
            returning id into reply_c;
            -- The minor becomes bat_a's friend (as postgres; follows are
            -- not client-insertable for other users).
            reset role;
            insert into public.follows (follower_id, followee_id) values
              (bat_teen, bat_a),
              (bat_a, bat_teen);
            set local role authenticated;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_teen, 'role', 'authenticated')::text, true);
            if not exists (select 1 from public.battle_requests where id = req_main) then
              raise exception 'BAT-CHECK: a friend still cannot see the request';
            end if;
            insert into public.battle_replies (request_id, responder_id)
            values (req_main, bat_teen)
            returning id into reply_teen;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_b, 'role', 'authenticated')::text, true);
            begin
              perform public.accept_battle_reply(reply_c);
              raise exception 'BAT-CHECK: a non-author accepted an offer';
            exception when others then
              if sqlerrm not like 'Only the author can accept offers%' then
                raise exception 'BAT-CHECK: non-author accept raised %', sqlerrm;
              end if;
            end;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            select public.accept_battle_reply(reply_main) into conv;
            if conv is null then
              raise exception 'BAT-CHECK: the DM thread did not open';
            end if;
            if not exists (
              select 1 from public.battle_replies
              where id = reply_c and status = 'declined'
            ) or not exists (
              select 1 from public.battle_replies
              where id = reply_teen and status = 'declined'
            ) then
              raise exception 'BAT-CHECK: the other offers were not declined';
            end if;
            -- The responder's notification belongs to bat_b; read it as
            -- postgres, then continue as the author.
            reset role;
            if not exists (
              select 1 from public.notifications
              where recipient_id = bat_b and actor_id = bat_a
                and type = 'battle' and battle_request_id = req_main
            ) then
              raise exception 'BAT-CHECK: the responder was not notified';
            end if;
            set local role authenticated;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            -- Re-accepting the accepted offer is refused.
            begin
              perform public.accept_battle_reply(reply_main);
              raise exception 'BAT-CHECK: an already-matched request was re-accepted';
            exception when others then
              if sqlerrm not like 'This offer is no longer available%'
                 and sqlerrm not like 'This battle request is no longer open%' then
                raise exception 'BAT-CHECK: re-accept raised %', sqlerrm;
              end if;
            end;

            -- Matched requests leave the board for everyone else, and the
            -- declined responders cannot see them either.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_c, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.battle_requests where id = req_main) then
              raise exception 'BAT-CHECK: an outsider saw a matched request';
            end if;

            -- The in-game code: only the matched pair reads it. The author
            -- sets it, bat_b (accepted) reads it, bat_c, the moderator and
            -- the declined minor cannot.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            insert into public.battle_request_codes (request_id, code)
            values (req_main, 'ROOM-1234');
            perform set_config('request.jwt.claims', json_build_object('sub', bat_b, 'role', 'authenticated')::text, true);
            if not exists (select 1 from public.battle_request_codes where request_id = req_main and code = 'ROOM-1234') then
              raise exception 'BAT-CHECK: the accepted responder cannot read the code';
            end if;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_c, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.battle_request_codes where request_id = req_main) then
              raise exception 'BAT-CHECK: an outsider read the code';
            end if;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_mod, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.battle_request_codes where request_id = req_main) then
              raise exception 'BAT-CHECK: a moderator read the code';
            end if;
            -- The moderator does see the request itself (the report flow).
            if not exists (select 1 from public.battle_requests where id = req_main) then
              raise exception 'BAT-CHECK: a moderator cannot read the request';
            end if;

            -- Nobody can flip a matched request's status: the update
            -- grant covers the status column, but the only update policy
            -- is the author's close policy, whose USING clause requires
            -- the row to be open or closed (matched rows are invisible to
            -- it), and the responder fails the author check.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_b, 'role', 'authenticated')::text, true);
            update public.battle_requests set status = 'open' where id = req_main;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            update public.battle_requests set status = 'closed' where id = req_main;
            if exists (select 1 from public.battle_requests where id = req_main and status <> 'matched') then
              raise exception 'BAT-CHECK: a matched request changed status';
            end if;
            -- played_at is not client-updatable at all.
            begin
              update public.battle_requests set played_at = now() where id = req_main;
              raise exception 'BAT-CHECK: a client wrote played_at directly';
            exception when others then
              if sqlerrm not like 'permission denied%' then
                raise exception 'BAT-CHECK: a direct played_at write raised %', sqlerrm;
              end if;
            end;

            -- Either matched player marks the battle played through the
            -- RPC, exactly once; nobody else can.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_b, 'role', 'authenticated')::text, true);
            perform public.mark_battle_played(req_main);
            if not exists (select 1 from public.battle_requests where id = req_main and played_at is not null) then
              raise exception 'BAT-CHECK: the responder could not mark the battle played';
            end if;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            begin
              perform public.mark_battle_played(req_main);
              raise exception 'BAT-CHECK: the battle was marked played twice';
            exception when others then
              if sqlerrm not like 'You cannot mark this battle played%' then
                raise exception 'BAT-CHECK: a second mark-played raised %', sqlerrm;
              end if;
            end;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_c, 'role', 'authenticated')::text, true);
            begin
              perform public.mark_battle_played(req_main);
              raise exception 'BAT-CHECK: an outsider marked the battle played';
            exception when others then
              if sqlerrm not like 'You cannot mark this battle played%' then
                raise exception 'BAT-CHECK: an outsider mark-played raised %', sqlerrm;
              end if;
            end;

            -- The author closes one of their open requests, can reopen it,
            -- and cannot forge 'matched' directly.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            select id into old_request from public.battle_requests
            where author_id = bat_a and status = 'open'
            limit 1;
            update public.battle_requests set status = 'closed' where id = old_request;
            if not exists (select 1 from public.battle_requests where id = old_request and status = 'closed') then
              raise exception 'BAT-CHECK: the author could not close their request';
            end if;
            update public.battle_requests set status = 'open' where id = old_request;
            begin
              update public.battle_requests set status = 'matched' where id = old_request;
            exception when others then
              null;
            end;
            if exists (select 1 from public.battle_requests where id = old_request and status = 'matched') then
              raise exception 'BAT-CHECK: the author forged a matched status';
            end if;

            -- Requests are reportable through the existing queue. Only the
            -- queue reads reports, so the read-back runs as the moderator.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_b, 'role', 'authenticated')::text, true);
            insert into public.reports (reporter_id, target_type, target_id, reason)
            values (bat_b, 'battle_request', req_main, 'other');
            perform set_config('request.jwt.claims', json_build_object('sub', bat_mod, 'role', 'authenticated')::text, true);
            if not exists (
              select 1 from public.reports
              where target_type = 'battle_request' and target_id = req_main
            ) then
              raise exception 'BAT-CHECK: the battle request report was not filed';
            end if;

            -- A block that arises after the offer hides it: accepting
            -- fails, so the pair is never matched against the rules.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            insert into public.battle_requests (author_id, format, rules, language)
            values (bat_a, 'doubles', 'block test', 'en')
            returning id into req_blocked;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_b, 'role', 'authenticated')::text, true);
            insert into public.battle_replies (request_id, responder_id)
            values (req_blocked, bat_b)
            returning id into reply_blocked;
            reset role;
            insert into public.blocks (blocker_id, blocked_id) values (bat_a, bat_b);
            set local role authenticated;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            begin
              perform public.accept_battle_reply(reply_blocked);
              raise exception 'BAT-CHECK: a blocked offer was accepted';
            exception when others then
              if sqlerrm not like 'You cannot accept this offer%' then
                raise exception 'BAT-CHECK: a blocked accept raised %', sqlerrm;
              end if;
            end;

            -- The moderation queue's Remove: a moderator closes the request
            -- and the action is recorded against the author; nobody else
            -- can call it.
            perform set_config('request.jwt.claims', json_build_object('sub', bat_mod, 'role', 'authenticated')::text, true);
            perform public.remove_battle_request_with_reason(req_fallback, 'test closing', null);
            if not exists (
              select 1 from public.battle_requests
              where id = req_fallback and status = 'closed'
            ) then
              raise exception 'BAT-CHECK: the moderation RPC did not close the request';
            end if;
            if not exists (
              select 1 from public.moderation_actions
              where target_type = 'battle_request' and target_id = req_fallback
            ) then
              raise exception 'BAT-CHECK: the moderation action was not recorded';
            end if;
            perform set_config('request.jwt.claims', json_build_object('sub', bat_b, 'role', 'authenticated')::text, true);
            begin
              perform public.remove_battle_request_with_reason(req_fallback, 'nope', null);
              raise exception 'BAT-CHECK: a non-moderator closed a request';
            exception when others then
              if sqlerrm not like 'Only moderators can remove battle requests%' then
                raise exception 'BAT-CHECK: a non-moderator remove raised %', sqlerrm;
              end if;
            end;

            -- The visibility helpers answer only for the caller:
            -- battle_visible_between and battle_playable_by are not
            -- executable by clients at all, and the policy helpers return
            -- false for any viewer other than the caller — even one who
            -- could see the row (bat_b is the accepted responder on
            -- req_main, bat_a asking for them gets no answer).
            perform set_config('request.jwt.claims', json_build_object('sub', bat_a, 'role', 'authenticated')::text, true);
            begin
              perform public.battle_visible_between(bat_a, bat_b);
              raise exception 'BAT-CHECK: a client called battle_visible_between';
            exception when others then
              if sqlerrm not like 'permission denied%' then
                raise exception 'BAT-CHECK: battle_visible_between raised %', sqlerrm;
              end if;
            end;
            begin
              perform public.battle_playable_by(req_main, bat_a);
              raise exception 'BAT-CHECK: a client called battle_playable_by';
            exception when others then
              if sqlerrm not like 'permission denied%' then
                raise exception 'BAT-CHECK: battle_playable_by raised %', sqlerrm;
              end if;
            end;
            if public.battle_request_visible(req_main, bat_b) then
              raise exception 'BAT-CHECK: battle_request_visible answered for another viewer';
            end if;
            if public.battle_code_visible(req_main, bat_b) then
              raise exception 'BAT-CHECK: battle_code_visible answered for another viewer';
            end if;
            if not public.battle_request_visible(req_main, bat_a) then
              raise exception 'BAT-CHECK: battle_request_visible stopped answering for the caller';
            end if;
            if not public.battle_code_visible(req_main, bat_a) then
              raise exception 'BAT-CHECK: battle_code_visible stopped answering for the caller';
            end if;
          end;
          $bat$;

          -- Expiry: day-old open requests expire; matched requests stay.
          do $exp$
          declare
            bat_a constant uuid := 'a5a5a5a5-a5a5-45a5-85a5-a5a5a5a5a5a5';
          begin
            update public.battle_requests
            set created_at = now() - interval '25 hours'
            where author_id = bat_a and status = 'open';
            perform public.expire_battle_requests();
            if exists (
              select 1 from public.battle_requests
              where author_id = bat_a and status = 'open'
            ) then
              raise exception 'BAT-CHECK: day-old open requests did not expire';
            end if;
            if not exists (
              select 1 from public.battle_requests
              where author_id = bat_a and status = 'matched'
            ) then
              raise exception 'BAT-CHECK: the matched request did not survive expiry';
            end if;
          end;
          $exp$;
          SQL

      # Exercises the write rate limits migration (20261122230000): every
      # table is seeded exactly at its limit inside the counting window,
      # so one more insert must raise its errcode. wl_a and wl_b are the
      # two real users; 120 throwaway accounts serve as followees, block
      # targets and group filler. Every failure raises with RATE-CHECK.
      - name: Write rate limits
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Setup, as postgres. The accounts are 4 days old with confirmed
          -- emails; profiles are created by the usual trigger.
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, email_confirmed_at, created_at, updated_at)
          values
            ('11000000-0000-4000-8000-00000000000a', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'wl-a@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('11000000-0000-4000-8000-00000000000b', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'wl-b@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now());
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, email_confirmed_at, created_at, updated_at)
          select ('10000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated',
                 'wl-x-' || g || '@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()
          from generate_series(1, 120) g;
          insert into public.profile_birth_dates (user_id, birth_date)
          values
            ('11000000-0000-4000-8000-00000000000a', '1990-01-01'),
            ('11000000-0000-4000-8000-00000000000b', '1990-01-01');

          -- Each seed sits exactly at its limit inside the window.
          -- follows: 100 in the last hour (limit 100/day).
          insert into public.follows (follower_id, followee_id, created_at)
          select '11000000-0000-4000-8000-00000000000a',
                 ('10000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 now() - interval '30 minutes'
          from generate_series(1, 100) g;
          -- blocks: 100 in the last hour (limit 100/day).
          insert into public.blocks (blocker_id, blocked_id, created_at)
          select '11000000-0000-4000-8000-00000000000a',
                 ('10000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 now() - interval '30 minutes'
          from generate_series(1, 100) g;
          -- post_likes: 301 back-dated posts (author wl_a, outside the
          -- posts-per-10-minutes window) and 300 likes in the last hour
          -- (limit 300/hour), leaving one post for the failing like.
          insert into public.posts (id, author_id, body, created_at, updated_at)
          select ('20000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 '11000000-0000-4000-8000-00000000000a',
                 'like bait ' || g, now() - interval '2 days', now() - interval '2 days'
          from generate_series(1, 301) g;
          insert into public.post_likes (post_id, user_id, created_at)
          select ('20000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 '11000000-0000-4000-8000-00000000000a',
                 now() - interval '30 minutes'
          from generate_series(1, 300) g;
          -- teams: 30 in the last hour (limit 30/day).
          insert into public.teams (id, user_id, name, data, created_at, updated_at)
          select ('30000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 '11000000-0000-4000-8000-00000000000a',
                 'team ' || g, '[]'::jsonb, now() - interval '30 minutes', now() - interval '30 minutes'
          from generate_series(1, 30) g;
          -- push_tokens: 20 in the last hour (limit 20/day).
          insert into public.push_tokens (id, user_id, token, created_at, last_seen_at)
          select ('40000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 '11000000-0000-4000-8000-00000000000a',
                 'wl-token-' || g, now() - interval '30 minutes', now() - interval '30 minutes'
          from generate_series(1, 20) g;
          -- group_members: 103 groups, each owned by its own throwaway
          -- account — the owner row the groups trigger inserts carries
          -- created_at = now(), so it counts toward the per-user limit
          -- and no single user can own them all (that is what tripped
          -- the first run of this step). wl_a joined the first 100 in
          -- the last hour (per-user limit 100/day on their own rows),
          -- group 101 has sent 100 pending invites (per-group invite
          -- limit 100/day), wl_b has received 100 invites (which must
          -- never count against them), group 102 is spare for the
          -- per-user check, and 101 different users joined group 103
          -- (a popular group keeps accepting members).
          insert into public.groups (id, owner_id, slug, name, visibility, created_at, updated_at)
          select ('50000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 ('10000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 'wl-group-' || g, 'wl group ' || g, 'public',
                 now() - interval '2 days', now() - interval '2 days'
          from generate_series(1, 103) g;
          insert into public.group_members (group_id, user_id, role, status, created_at)
          select ('50000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 '11000000-0000-4000-8000-00000000000a',
                 'member', 'active', now() - interval '30 minutes'
          from generate_series(1, 100) g;
          insert into public.group_members (group_id, user_id, role, status, created_at)
          select ('50000000-0000-4000-8000-000000000101')::uuid,
                 ('10000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 'member', 'invited', now() - interval '30 minutes'
          from generate_series(1, 100) g;
          insert into public.group_members (group_id, user_id, role, status, created_at)
          select ('50000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 '11000000-0000-4000-8000-00000000000b',
                 'member', 'invited', now() - interval '30 minutes'
          from generate_series(1, 100) g;
          insert into public.group_members (group_id, user_id, role, status, created_at)
          select ('50000000-0000-4000-8000-000000000103')::uuid,
                 ('10000000-0000-4000-8000-' || lpad(g::text, 12, '0'))::uuid,
                 'member', 'active', now() - interval '30 minutes'
          from generate_series(1, 101) g;

          -- The checks, one per limit. Each insert must raise its errcode.
          do $wl$
          declare
            wl_a constant uuid := '11000000-0000-4000-8000-00000000000a';
            wl_b constant uuid := '11000000-0000-4000-8000-00000000000b';
            spare_profile constant uuid := '10000000-0000-4000-8000-000000000121';
            spare_post constant uuid := '20000000-0000-4000-8000-000000000301';
            spare_group constant uuid := '50000000-0000-4000-8000-000000000102';
            full_group constant uuid := '50000000-0000-4000-8000-000000000101';
            popular_group constant uuid := '50000000-0000-4000-8000-000000000103';
            -- Throwaway 101 owns group 101 (the invite sender); 104 has
            -- no rows yet (the invite the cap must refuse).
            full_group_owner constant uuid := '10000000-0000-4000-8000-000000000101';
            fresh_invitee constant uuid := '10000000-0000-4000-8000-000000000104';
          begin
            set local role authenticated;

            perform set_config('request.jwt.claims', json_build_object('sub', wl_a, 'role', 'authenticated')::text, true);
            begin
              insert into public.follows (follower_id, followee_id) values (wl_a, spare_profile);
              raise exception 'RATE-CHECK: the follow limit did not fire';
            exception when others then
              if sqlerrm not like 'Too many follows%' then
                raise exception 'RATE-CHECK: follow limit raised %', sqlerrm;
              end if;
            end;
            begin
              insert into public.post_likes (post_id, user_id) values (spare_post, wl_a);
              raise exception 'RATE-CHECK: the like limit did not fire';
            exception when others then
              if sqlerrm not like 'Too many likes%' then
                raise exception 'RATE-CHECK: like limit raised %', sqlerrm;
              end if;
            end;
            begin
              insert into public.teams (user_id, name, data) values (wl_a, 'one too many', '[]'::jsonb);
              raise exception 'RATE-CHECK: the team limit did not fire';
            exception when others then
              if sqlerrm not like 'Too many new teams%' then
                raise exception 'RATE-CHECK: team limit raised %', sqlerrm;
              end if;
            end;
            begin
              insert into public.blocks (blocker_id, blocked_id)
              values (wl_a, '10000000-0000-4000-8000-000000000122');
              raise exception 'RATE-CHECK: the block limit did not fire';
            exception when others then
              if sqlerrm not like 'Too many blocks%' then
                raise exception 'RATE-CHECK: block limit raised %', sqlerrm;
              end if;
            end;
            -- The per-user branch of the group limit: wl_a has 100 rows.
            begin
              insert into public.group_members (group_id, user_id, role, status)
              values (spare_group, wl_a, 'member', 'active');
              raise exception 'RATE-CHECK: the per-user group limit did not fire';
            exception when others then
              if sqlerrm not like 'Too many group joins and invites%' then
                raise exception 'RATE-CHECK: per-user group limit raised %', sqlerrm;
              end if;
            end;
            -- The invite branch: group 101 has sent 100 invites today;
            -- its owner cannot send one more.
            perform set_config('request.jwt.claims', json_build_object('sub', full_group_owner, 'role', 'authenticated')::text, true);
            begin
              insert into public.group_members (group_id, user_id, role, status)
              values (full_group, fresh_invitee, 'member', 'invited');
              raise exception 'RATE-CHECK: the group invite limit did not fire';
            exception when others then
              if sqlerrm not like 'Too many group joins and invites%' then
                raise exception 'RATE-CHECK: group invite limit raised %', sqlerrm;
              end if;
            end;
            -- Invites received never count against the invitee: wl_b
            -- holds 100 pending invites and still joins a public group,
            -- making the popular group 103 members strong (its owner,
            -- the 101 seed joins and wl_b).
            perform set_config('request.jwt.claims', json_build_object('sub', wl_b, 'role', 'authenticated')::text, true);
            insert into public.group_members (group_id, user_id, role, status)
            values (popular_group, wl_b, 'member', 'active');
            if (
              select count(*) from public.group_members
              where group_members.group_id = popular_group
                and group_members.status = 'active'
            ) <> 103 then
              raise exception 'RATE-CHECK: the popular group lost members';
            end if;
          end;
          $wl$;

          -- push_tokens has no client insert path (the register RPC owns
          -- it), so the check runs as postgres; the trigger is the same.
          do $pt$
          declare
            wl_a constant uuid := '11000000-0000-4000-8000-00000000000a';
          begin
            begin
              insert into public.push_tokens (user_id, token)
              values (wl_a, 'wl-token-21');
              raise exception 'RATE-CHECK: the push token limit did not fire';
            exception when others then
              if sqlerrm not like 'Too many push token registrations%' then
                raise exception 'RATE-CHECK: push token limit raised %', sqlerrm;
              end if;
            end;
          end;
          $pt$;
          SQL

      - name: Stop
        if: always()
        run: supabase stop --no-backup
