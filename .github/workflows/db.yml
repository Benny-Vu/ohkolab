name: Database

# Builds a fresh local Supabase from supabase/migrations on every change to them,
# then lints the database and checks that every public table has row-level security.
# Catches broken SQL before it reaches the live project.

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  push:
    branches-ignore:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start a local Supabase and apply all migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime

      - name: Lint the database (plpgsql_check)
        run: supabase db lint --local --level warning --fail-on error

      - name: Every public table has row-level security
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          missing=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -c "
            select coalesce(string_agg(c.relname, ', ' order by c.relname), '')
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r' and not c.relrowsecurity")
          if [ -n "$missing" ]; then
            echo "::error::Tables without RLS: $missing"
            exit 1
          fi
          echo "All public tables have RLS."

      # Exercises the "authors delete their own pending images" policy from
      # 20261120100000_pending_image_delete.sql as a real authenticated user.
      - name: Pending-image delete policy behaviour
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          AUTHOR_ID: 11111111-1111-4111-8111-111111111111
          OTHER_ID: 22222222-2222-4222-8222-222222222222
          POST_ID: 33333333-3333-4333-8333-333333333333
          OWN_PENDING_ID: 44444444-4444-4444-8444-444444444444
          OWN_APPROVED_ID: 55555555-5555-4555-8555-555555555555
          OTHER_PENDING_ID: 66666666-6666-4666-8666-666666666666
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, created_at, updated_at)
          values
            ('11111111-1111-4111-8111-111111111111', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'policy-ci-a@example.com', 'x', now(), now()),
            ('22222222-2222-4222-8222-222222222222', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'policy-ci-b@example.com', 'x', now(), now());
          -- The new-user trigger already made both profiles; just name them.
          insert into public.profiles (id, username) values
            ('11111111-1111-4111-8111-111111111111', 'policy_ci_a'),
            ('22222222-2222-4222-8222-222222222222', 'policy_ci_b')
          on conflict (id) do update set username = excluded.username;
          insert into public.posts (id, author_id, body) values
            ('33333333-3333-4333-8333-333333333333', '11111111-1111-4111-8111-111111111111', 'policy check'),
            ('33333333-3333-4333-8333-333333333334', '22222222-2222-4222-8222-222222222222', 'policy check');
          insert into public.post_images (id, post_id, author_id, position, pending_path, width, height, bytes, status) values
            ('44444444-4444-4444-8444-444444444444', '33333333-3333-4333-8333-333333333333', '11111111-1111-4111-8111-111111111111', 0, '11111111-1111-4111-8111-111111111111/pending.webp', 10, 10, 100, 'pending'),
            ('55555555-5555-4555-8555-555555555555', '33333333-3333-4333-8333-333333333333', '11111111-1111-4111-8111-111111111111', 1, '11111111-1111-4111-8111-111111111111/approved.webp', 10, 10, 100, 'approved'),
            ('66666666-6666-4666-8666-666666666666', '33333333-3333-4333-8333-333333333334', '22222222-2222-4222-8222-222222222222', 0, '22222222-2222-4222-8222-222222222222/pending.webp', 10, 10, 100, 'pending');
          SQL

          # Runs one delete as the author and prints how many rows it removed.
          delete_as_author() {
            # psql only substitutes :'var' in SQL read from stdin, not in -c.
            # -q hides the BEGIN/SET/COMMIT tags so only the count prints.
            psql "$DB_URL" -qtA -v ON_ERROR_STOP=1 -v img="$1" \
              -v claims='{"sub":"11111111-1111-4111-8111-111111111111","role":"authenticated"}' <<'SQL'
          begin;
          set local role authenticated;
          set local request.jwt.claims to :'claims';
          with del as (
            delete from public.post_images where id = :'img' returning 1
          ) select count(*) from del;
          commit;
          SQL
          }

          own_pending=$(delete_as_author "$OWN_PENDING_ID")
          if [ "$own_pending" != "1" ]; then
            echo "::error::Author could not delete their own pending image (got $own_pending)"
            exit 1
          fi
          echo "Author can delete their own pending image."

          own_approved=$(delete_as_author "$OWN_APPROVED_ID")
          if [ "$own_approved" != "0" ]; then
            echo "::error::Author deleted a non-pending image (got $own_approved)"
            exit 1
          fi
          echo "Author cannot delete an approved image."

          foreign_pending=$(delete_as_author "$OTHER_PENDING_ID")
          if [ "$foreign_pending" != "0" ]; then
            echo "::error::Author deleted someone else's image (got $foreign_pending)"
            exit 1
          fi
          echo "Author cannot delete another author's image."

      # Exercises the direct messages migration (20261120110000) as two
      # normal users and a moderator. The accounts are created 4 days old
      # with confirmed emails so start_conversation's account-age rule passes.
      - name: Direct message policies
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Setup, as postgres: six accounts. dm_a and dm_b are adult
          -- friends; dm_teen is 14 (friends-only by the minor rule); dm_c is
          -- an unconnected adult; dm_mod is a moderator. dm_f1..dm_f10 are
          -- adult friends of dm_a for the conversation rate limit.
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, email_confirmed_at, created_at, updated_at)
          values
            ('77777777-7777-4777-8777-777777777777', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-a@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('88888888-8888-4888-8888-888888888888', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-b@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('99999999-9999-4999-8999-999999999999', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-c@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-teen@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-mod@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000001', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f1@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000002', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f2@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000003', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f3@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000004', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f4@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000005', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f5@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000006', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f6@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000007', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f7@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000008', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f8@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000009', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f9@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now()),
            ('cccccccc-0000-4000-8000-000000000010', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'dm-f10@example.com', 'x', now() - interval '4 days', now() - interval '4 days', now());

          -- Birth dates: adults 1990, the teen 2012 (14, above the 13 floor).
          insert into public.profile_birth_dates (user_id, birth_date) values
            ('77777777-7777-4777-8777-777777777777', '1990-01-01'),
            ('88888888-8888-4888-8888-888888888888', '1990-01-01'),
            ('99999999-9999-4999-8999-999999999999', '1990-01-01'),
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', '2012-06-01'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', '1990-01-01');
          insert into public.profile_birth_dates (user_id, birth_date)
          select id, '1990-01-01' from public.profiles
          where id::text like 'cccccccc-%';

          insert into public.user_roles (user_id, role)
          values ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', 'moderator');

          -- dm_a and dm_b are friends (mutual follows); dm_a also follows
          -- all ten dm_f users both ways.
          insert into public.follows (follower_id, followee_id) values
            ('77777777-7777-4777-8777-777777777777', '88888888-8888-4888-8888-888888888888'),
            ('88888888-8888-4888-8888-888888888888', '77777777-7777-4777-8777-777777777777');
          insert into public.follows (follower_id, followee_id)
          select '77777777-7777-4777-8777-777777777777', id from public.profiles
          where id::text like 'cccccccc-%';
          insert into public.follows (follower_id, followee_id)
          select id, '77777777-7777-4777-8777-777777777777' from public.profiles
          where id::text like 'cccccccc-%';

          -- The behaviour checks, running as the authenticated role with
          -- each user's claims. Every failure raises with DM-CHECK.
          do $dm$
          declare
            dm_a constant uuid := '77777777-7777-4777-8777-777777777777';
            dm_b constant uuid := '88888888-8888-4888-8888-888888888888';
            dm_c constant uuid := '99999999-9999-4999-8999-999999999999';
            dm_teen constant uuid := 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
            dm_mod constant uuid := 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';
            conv uuid;
            reported uuid;
            friend uuid;
          begin
            set local role authenticated;

            -- dm_a starts a conversation with dm_b and sends a message.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_a, 'role', 'authenticated')::text, true);
            select public.start_conversation(dm_b) into conv;
            if conv is null then
              raise exception 'DM-CHECK: start_conversation returned null';
            end if;
            insert into public.messages (conversation_id, sender_id, body)
            values (conv, dm_a, 'policy check');
            if not exists (select 1 from public.messages where conversation_id = conv) then
              raise exception 'DM-CHECK: message insert failed';
            end if;

            -- The outsider dm_c cannot read the conversation or its messages.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_c, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.conversations where id = conv)
               or exists (select 1 from public.messages where conversation_id = conv) then
              raise exception 'DM-CHECK: outsider read the conversation';
            end if;

            -- The moderator cannot read unreported messages either.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_mod, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.messages where conversation_id = conv) then
              raise exception 'DM-CHECK: moderator read unreported messages';
            end if;

            -- A minor cannot be messaged by a non-friend adult, and the
            -- minor cannot start one either.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_a, 'role', 'authenticated')::text, true);
            begin
              perform public.start_conversation(dm_teen);
              raise exception 'DM-CHECK: adult messaged a non-friend minor';
            exception when others then
              if sqlerrm not like 'You can only message friends%' then
                raise exception 'DM-CHECK: minor rule raised %', sqlerrm;
              end if;
            end;
            perform set_config('request.jwt.claims', json_build_object('sub', dm_teen, 'role', 'authenticated')::text, true);
            begin
              perform public.start_conversation(dm_c);
              raise exception 'DM-CHECK: minor started a conversation with a stranger';
            exception when others then
              if sqlerrm not like 'You can only message friends%' then
                raise exception 'DM-CHECK: minor rule raised %', sqlerrm;
              end if;
            end;

            -- The message rate limit: 20 per minute. dm_a already sent 1,
            -- so 19 more pass and the 21st raises P0A09.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_a, 'role', 'authenticated')::text, true);
            for i in 1..19 loop
              insert into public.messages (conversation_id, sender_id, body)
              values (conv, dm_a, 'rate ' || i);
            end loop;
            begin
              insert into public.messages (conversation_id, sender_id, body)
              values (conv, dm_a, 'one too many');
              raise exception 'DM-CHECK: message rate limit did not fire';
            exception when others then
              if sqlerrm not like 'Sending messages too quickly%' then
                raise exception 'DM-CHECK: message rate limit raised %', sqlerrm;
              end if;
            end;

            -- The conversation rate limit: 10 per 24 hours. dm_a has 1;
            -- nine more pass and the 11th raises P0A08.
            for f in 1..9 loop
              select id into friend from public.profiles
              where id::text = 'cccccccc-0000-4000-8000-0000000000'
                || lpad(f::text, 2, '0');
              perform public.start_conversation(friend);
            end loop;
            select id into friend from public.profiles
            where id::text = 'cccccccc-0000-4000-8000-000000000010';
            begin
              perform public.start_conversation(friend);
              raise exception 'DM-CHECK: conversation rate limit did not fire';
            exception when others then
              if sqlerrm not like 'Too many new conversations today%' then
                raise exception 'DM-CHECK: conversation rate limit raised %', sqlerrm;
              end if;
            end;

            -- Reopening an existing conversation still works at the limit.
            if public.start_conversation(dm_b) is distinct from conv then
              raise exception 'DM-CHECK: reopening a conversation hit the daily limit';
            end if;

            -- Clients can't ask whether another user is an adult.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_c, 'role', 'authenticated')::text, true);
            begin
              perform public.is_adult(dm_teen);
              raise exception 'DM-CHECK: a client could call is_adult';
            exception when insufficient_privilege then
              null;
            end;

            -- Reporting: dm_b reports dm_a's last message; the moderator
            -- can then read the snapshot (all 20 messages: the reported
            -- one plus the 19 before it) but still not the messages table.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_b, 'role', 'authenticated')::text, true);
            select id into reported from public.messages
            where conversation_id = conv and body = 'rate 19';
            perform public.report_message(reported, 'harassment');
            perform set_config('request.jwt.claims', json_build_object('sub', dm_mod, 'role', 'authenticated')::text, true);
            if not exists (
              select 1 from public.message_reports
              where message_id = reported
                and jsonb_array_length(snapshot) = 20
            ) then
              raise exception 'DM-CHECK: report snapshot missing or wrong size';
            end if;
            if exists (select 1 from public.messages where conversation_id = conv) then
              raise exception 'DM-CHECK: moderator read unreported messages after a report';
            end if;

            -- A blocked user cannot send. dm_b blocks dm_a (as dm_b; the
            -- blocks policy only allows blocking as yourself); dm_a's next
            -- message is rejected with the block message.
            perform set_config('request.jwt.claims', json_build_object('sub', dm_b, 'role', 'authenticated')::text, true);
            insert into public.blocks (blocker_id, blocked_id) values (dm_b, dm_a);
            perform set_config('request.jwt.claims', json_build_object('sub', dm_a, 'role', 'authenticated')::text, true);
            begin
              insert into public.messages (conversation_id, sender_id, body)
              values (conv, dm_a, 'still trying');
              raise exception 'DM-CHECK: blocked user sent a message';
            exception when others then
              if sqlerrm not like 'You cannot message this user%' then
                raise exception 'DM-CHECK: block rule raised %', sqlerrm;
              end if;
            end;
          end;
          $dm$;

          -- Account deletion, as postgres: deleting dm_a removes their
          -- conversations and messages, but the reported snapshot stays
          -- for its year.
          do $keep$
          begin
            delete from auth.users where id = '77777777-7777-4777-8777-777777777777';
            if exists (select 1 from public.messages where sender_id = '77777777-7777-4777-8777-777777777777') then
              raise exception 'DM-CHECK: messages survived account deletion';
            end if;
            if not exists (select 1 from public.message_reports where jsonb_array_length(snapshot) = 20) then
              raise exception 'DM-CHECK: the report snapshot was deleted with the account';
            end if;
          end;
          $keep$;
          SQL

      # Exercises the push notifications migration (20261120210000):
      # token and settings policies are per-user, the claim functions batch
      # and cooldown, and account deletion cascades tokens and settings.
      # push_config stays empty here, so the webhook triggers are silent.
      - name: Push notification policies and claims
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, created_at, updated_at)
          values
            ('ffffffff-ffff-4fff-8fff-ffffffffffff', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'push-a@example.com', 'x', now(), now()),
            ('90909090-9090-4909-8909-909090909090', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'push-b@example.com', 'x', now(), now()),
            ('a0a0a0a0-a0a0-4a0a-8a0a-a0a0a0a0a0a0', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'push-c@example.com', 'x', now(), now());
          insert into public.profiles (id, username) values
            ('ffffffff-ffff-4fff-8fff-ffffffffffff', 'push_a'),
            ('90909090-9090-4909-8909-909090909090', 'push_b'),
            ('a0a0a0a0-a0a0-4a0a-8a0a-a0a0a0a0a0a0', 'push_c')
          on conflict (id) do update set username = excluded.username;
          -- Adults, so the message rules treat them as adults (users
          -- without a birth date message friends only).
          insert into public.profile_birth_dates (user_id, birth_date) values
            ('ffffffff-ffff-4fff-8fff-ffffffffffff', '1990-01-01'),
            ('90909090-9090-4909-8909-909090909090', '1990-01-01');

          do $push$
          declare
            push_a constant uuid := 'ffffffff-ffff-4fff-8fff-ffffffffffff';
            push_b constant uuid := '90909090-9090-4909-8909-909090909090';
            push_c constant uuid := 'a0a0a0a0-a0a0-4a0a-8a0a-a0a0a0a0a0a0';
            claimed int;
            push_post uuid;
          begin
            set local role authenticated;

            -- Tokens register through register_push_token() only; the
            -- owner re-registering keeps exactly one row.
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            perform public.register_push_token('fcm-token-shared-1', 'android');
            perform public.register_push_token('fcm-token-shared-1', 'android');
            if (select count(*) from public.push_tokens where user_id = push_a) <> 1 then
              raise exception 'PUSH-CHECK: re-registration duplicated the token row';
            end if;

            -- Direct writes are closed: there is no insert grant.
            begin
              insert into public.push_tokens (user_id, token, platform)
              values (push_a, 'fcm-token-direct', 'android');
              raise exception 'PUSH-CHECK: a direct token insert worked';
            exception when insufficient_privilege then
              null;
            end;

            -- A malformed platform is rejected by the RPC.
            begin
              perform public.register_push_token('fcm-token-bad', 'windows');
              raise exception 'PUSH-CHECK: a bad platform was accepted';
            exception when check_violation then
              null;
            end;

            -- Another user sees none of the owner's tokens and cannot
            -- remove them (verified with the owner's claims, since the
            -- other user cannot even see the row).
            perform set_config('request.jwt.claims', json_build_object('sub', push_b, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.push_tokens where user_id = push_a) then
              raise exception 'PUSH-CHECK: another user read a foreign token';
            end if;
            delete from public.push_tokens where user_id = push_a;
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            if not exists (select 1 from public.push_tokens where user_id = push_a) then
              raise exception 'PUSH-CHECK: another user deleted a foreign token';
            end if;

            -- Shared device: the new user registers the same token and
            -- it moves to them; the previous owner holds it no longer.
            perform set_config('request.jwt.claims', json_build_object('sub', push_b, 'role', 'authenticated')::text, true);
            perform public.register_push_token('fcm-token-shared-1', 'android');
            if not exists (
              select 1 from public.push_tokens
              where token = 'fcm-token-shared-1' and user_id = push_b
            ) then
              raise exception 'PUSH-CHECK: the token did not move to the new user';
            end if;
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            if exists (
              select 1 from public.push_tokens
              where token = 'fcm-token-shared-1' and user_id = push_a
            ) then
              raise exception 'PUSH-CHECK: the previous owner still holds the token';
            end if;

            -- Sign-out on the device: the current owner removes their row.
            perform set_config('request.jwt.claims', json_build_object('sub', push_b, 'role', 'authenticated')::text, true);
            delete from public.push_tokens where user_id = push_b;
            if exists (select 1 from public.push_tokens where user_id = push_b) then
              raise exception 'PUSH-CHECK: the owner could not remove their token';
            end if;

            -- Settings: the owner writes theirs, nobody else sees them.
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            insert into public.push_settings (user_id, enabled) values (push_a, false);
            if not exists (select 1 from public.push_settings where user_id = push_a and enabled = false) then
              raise exception 'PUSH-CHECK: owner cannot write their push settings';
            end if;
            perform set_config('request.jwt.claims', json_build_object('sub', push_b, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.push_settings where user_id = push_a) then
              raise exception 'PUSH-CHECK: another user read foreign push settings';
            end if;
            update public.push_settings set enabled = true where user_id = push_a;
            -- Verified with the owner's claims: the blocked update must
            -- have changed nothing.
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.push_settings where user_id = push_a and enabled = true) then
              raise exception 'PUSH-CHECK: another user changed foreign push settings';
            end if;

            -- A like and a follow both notify push_a (the webhook trigger
            -- is silent: push_config is empty here). The post id comes
            -- from the insert: the authenticated role has no insert grant
            -- on posts.id.
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            insert into public.posts (author_id, body) values
              (push_a, 'push check')
              returning id into push_post;
            perform set_config('request.jwt.claims', json_build_object('sub', push_b, 'role', 'authenticated')::text, true);
            insert into public.post_likes (post_id, user_id) values
              (push_post, push_b);
            insert into public.follows (follower_id, followee_id) values (push_b, push_a);

            reset role;
            -- The claim batches both notifications into one push...
            select count(*) into claimed from public.claim_push_batch(push_a);
            if claimed <> 2 then
              raise exception 'PUSH-CHECK: claim_push_batch returned % rows, expected 2', claimed;
            end if;
            -- ...and the one-minute cooldown makes the next claim empty.
            select count(*) into claimed from public.claim_push_batch(push_a);
            if claimed <> 0 then
              raise exception 'PUSH-CHECK: claim_push_batch ignored the cooldown';
            end if;

            -- A notification arriving inside the cooldown rides with the
            -- next claim instead of pushing on its own.
            set local role authenticated;
            perform set_config('request.jwt.claims', json_build_object('sub', push_c, 'role', 'authenticated')::text, true);
            insert into public.follows (follower_id, followee_id) values (push_c, push_a);
            reset role;
            select count(*) into claimed from public.claim_push_batch(push_a);
            if claimed <> 0 then
              raise exception 'PUSH-CHECK: claim_push_batch pushed inside the cooldown';
            end if;
            if not exists (
              select 1 from public.notifications
              where recipient_id = push_a and pushed_at is null
            ) then
              raise exception 'PUSH-CHECK: a cooldown notification was claimed anyway';
            end if;

            -- Direct messages: the sender's own claim stays empty, the
            -- recipient's claims the row. The conversation is created as
            -- postgres (start_conversation has friend rules); the message
            -- goes in as its real sender.
            insert into public.conversations (id, user_a, user_b, created_by) values
              ('c2c2c2c2-c2c2-4c2c-8c2c-c2c2c2c2c2c2', push_b, push_a, push_b);
            insert into public.conversation_participants (conversation_id, user_id) values
              ('c2c2c2c2-c2c2-4c2c-8c2c-c2c2c2c2c2c2', push_b),
              ('c2c2c2c2-c2c2-4c2c-8c2c-c2c2c2c2c2c2', push_a);
            set local role authenticated;
            perform set_config('request.jwt.claims', json_build_object('sub', push_b, 'role', 'authenticated')::text, true);
            insert into public.messages (conversation_id, sender_id, body)
            values ('c2c2c2c2-c2c2-4c2c-8c2c-c2c2c2c2c2c2', push_b, 'secret message body');
            reset role;
            select count(*) into claimed from public.claim_push_messages(push_b);
            if claimed <> 0 then
              raise exception 'PUSH-CHECK: the sender claimed their own message';
            end if;
            select count(*) into claimed from public.claim_push_messages(push_a);
            if claimed <> 1 then
              raise exception 'PUSH-CHECK: claim_push_messages returned % rows, expected 1', claimed;
            end if;

            -- A final token for push_a so the account-deletion cascade
            -- below has a row to catch.
            set local role authenticated;
            perform set_config('request.jwt.claims', json_build_object('sub', push_a, 'role', 'authenticated')::text, true);
            perform public.register_push_token('fcm-token-a-final', 'android');
          end;
          $push$;

          -- Account deletion cascades the tokens and settings away.
          do $gone$
          begin
            delete from auth.users where id = 'ffffffff-ffff-4fff-8fff-ffffffffffff';
            if exists (select 1 from public.push_tokens where user_id = 'ffffffff-ffff-4fff-8fff-ffffffffffff') then
              raise exception 'PUSH-CHECK: tokens survived account deletion';
            end if;
            if exists (select 1 from public.push_settings where user_id = 'ffffffff-ffff-4fff-8fff-ffffffffffff') then
              raise exception 'PUSH-CHECK: push settings survived account deletion';
            end if;
          end;
          $gone$;
          SQL

      # Exercises the Champions team ID column
      # (20261120200000_team_game_id.sql): the owner reads and writes their
      # own ID, another user sees it only on a public team, and the check
      # constraint rejects malformed IDs.
      - name: Team game ID visibility
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, created_at, updated_at)
          values
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'team-id-a@example.com', 'x', now(), now()),
            ('eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'team-id-b@example.com', 'x', now(), now());
          insert into public.profiles (id, username) values
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd', 'team_id_a'),
            ('eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee', 'team_id_b')
          on conflict (id) do update set username = excluded.username;

          -- The owner's teams: one private, one public, both with an ID.
          -- The other user's team stays private without one.
          insert into public.teams (id, user_id, name, data, is_public, game_team_id) values
            ('12121212-1212-4121-8121-121212121212', 'dddddddd-dddd-4ddd-8ddd-dddddddddddd', 'Private team', '[]'::jsonb, false, 'AbCd123456'),
            ('13131313-1313-4131-8131-131313131313', 'dddddddd-dddd-4ddd-8ddd-dddddddddddd', 'Public team', '[]'::jsonb, true, 'EfGh456789');

          -- Behaviour checks, as the authenticated role with each user's
          -- claims. Every failure raises with TEAM-ID-CHECK.
          do $team$
          declare
            owner constant uuid := 'dddddddd-dddd-4ddd-8ddd-dddddddddddd';
            other constant uuid := 'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee';
            private_team constant uuid := '12121212-1212-4121-8121-121212121212';
            public_team constant uuid := '13131313-1313-4131-8131-131313131313';
          begin
            set local role authenticated;

            -- The owner reads and updates their own private team's ID.
            perform set_config('request.jwt.claims', json_build_object('sub', owner, 'role', 'authenticated')::text, true);
            if not exists (
              select 1 from public.teams
              where id = private_team and game_team_id = 'AbCd123456'
            ) then
              raise exception 'TEAM-ID-CHECK: owner cannot read their private team''s ID';
            end if;
            update public.teams set game_team_id = 'ZzYx987654' where id = private_team;
            if not exists (
              select 1 from public.teams
              where id = private_team and game_team_id = 'ZzYx987654'
            ) then
              raise exception 'TEAM-ID-CHECK: owner cannot update their team''s ID';
            end if;

            -- Another user cannot read the private team at all, so its ID
            -- never reaches them.
            perform set_config('request.jwt.claims', json_build_object('sub', other, 'role', 'authenticated')::text, true);
            if exists (select 1 from public.teams where id = private_team) then
              raise exception 'TEAM-ID-CHECK: another user read a private team';
            end if;

            -- The same user reads the public team's ID.
            if not exists (
              select 1 from public.teams
              where id = public_team and game_team_id = 'EfGh456789'
            ) then
              raise exception 'TEAM-ID-CHECK: public team ID unreadable';
            end if;
          end;
          $team$;

          -- The check constraint rejects malformed IDs (as postgres).
          do $shape$
          begin
            begin
              insert into public.teams (id, user_id, name, data, game_team_id)
              values ('14141414-1414-4141-8141-141414141414',
                      'dddddddd-dddd-4ddd-8ddd-dddddddddddd', 'Bad', '[]'::jsonb, 'short');
              raise exception 'TEAM-ID-CHECK: a malformed ID was accepted';
            exception when check_violation then
              null;
            end;
          end;
          $shape$;
          SQL

      # Exercises the community wave (20261121200000): the new profile
      # fields are public but only the owner writes them, URL and enum
      # checks fire, and posts/groups accept and expose their tags.
      - name: Community profile fields and tags
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, instance_id, aud, role, email, encrypted_password, created_at, updated_at)
          values
            ('d1d1d1d1-d1d1-4d1d-8d1d-d1d1d1d1d1d1', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'comm-a@example.com', 'x', now(), now()),
            ('e2e2e2e2-e2e2-4e2e-8e2e-e2e2e2e2e2e2', '00000000-0000-0000-0000-000000000000', 'authenticated', 'authenticated', 'comm-b@example.com', 'x', now(), now());
          insert into public.profiles (id, username) values
            ('d1d1d1d1-d1d1-4d1d-8d1d-d1d1d1d1d1d1', 'comm_a'),
            ('e2e2e2e2-e2e2-4e2e-8e2e-e2e2e2e2e2e2', 'comm_b')
          on conflict (id) do update set username = excluded.username;

          do $comm$
          declare
            comm_a constant uuid := 'd1d1d1d1-d1d1-4d1d-8d1d-d1d1d1d1d1d1';
            comm_b constant uuid := 'e2e2e2e2-e2e2-4e2e-8e2e-e2e2e2e2e2e2';
          begin
            set local role authenticated;

            -- The owner fills in every new field.
            perform set_config('request.jwt.claims', json_build_object('sub', comm_a, 'role', 'authenticated')::text, true);
            update public.profiles set
              favourite_species = 'Garchomp',
              main_format = 'doubles',
              looking_for = 'practice partners',
              youtube_url = 'https://youtube.com/@example',
              twitch_url = 'https://twitch.tv/example',
              showdown_name = 'example'
            where id = comm_a;
            if not exists (
              select 1 from public.profiles
              where id = comm_a
                and favourite_species = 'Garchomp'
                and main_format = 'doubles'
                and looking_for = 'practice partners'
                and youtube_url = 'https://youtube.com/@example'
                and showdown_name = 'example'
            ) then
              raise exception 'COMM-CHECK: owner cannot write the new profile fields';
            end if;

            -- The enum and https checks fire.
            begin
              update public.profiles set main_format = 'triples' where id = comm_a;
              raise exception 'COMM-CHECK: a bad main_format was accepted';
            exception when check_violation then
              null;
            end;
            begin
              update public.profiles set youtube_url = 'http://insecure.example' where id = comm_a;
              raise exception 'COMM-CHECK: a non-https link was accepted';
            exception when check_violation then
              null;
            end;

            -- Anyone reads the fields; nobody else writes them.
            perform set_config('request.jwt.claims', json_build_object('sub', comm_b, 'role', 'authenticated')::text, true);
            if not exists (
              select 1 from public.profiles
              where id = comm_a and looking_for = 'practice partners'
            ) then
              raise exception 'COMM-CHECK: the new fields are not public';
            end if;
            update public.profiles set looking_for = 'hijacked' where id = comm_a;
            perform set_config('request.jwt.claims', json_build_object('sub', comm_a, 'role', 'authenticated')::text, true);
            if exists (
              select 1 from public.profiles
              where id = comm_a and looking_for = 'hijacked'
            ) then
              raise exception 'COMM-CHECK: another user changed the profile fields';
            end if;

            -- Posts: the author tags a language, and only the author may
            -- change it.
            perform set_config('request.jwt.claims', json_build_object('sub', comm_a, 'role', 'authenticated')::text, true);
            insert into public.posts (author_id, body, language)
            values (comm_a, 'community check', 'ja');
            if not exists (
              select 1 from public.posts
              where author_id = comm_a and language = 'ja'
            ) then
              raise exception 'COMM-CHECK: the post language tag did not save';
            end if;
            begin
              insert into public.posts (author_id, body, language)
              values (comm_a, 'bad tag', 'fr');
              raise exception 'COMM-CHECK: a bad post language was accepted';
            exception when check_violation then
              null;
            end;
            update public.posts set language = 'en' where author_id = comm_a;
            if not exists (
              select 1 from public.posts where author_id = comm_a and language = 'en'
            ) then
              raise exception 'COMM-CHECK: the author could not retag their post';
            end if;
            perform set_config('request.jwt.claims', json_build_object('sub', comm_b, 'role', 'authenticated')::text, true);
            update public.posts set language = 'ja' where author_id = comm_a;
            perform set_config('request.jwt.claims', json_build_object('sub', comm_a, 'role', 'authenticated')::text, true);
            if exists (
              select 1 from public.posts where author_id = comm_a and language = 'ja'
            ) then
              raise exception 'COMM-CHECK: another user retagged the post';
            end if;

            -- Groups: the owner sets a category and language; the checks
            -- fire; the tags are public.
            insert into public.groups (slug, name, owner_id, category, language)
            values ('community-check', 'Community check', comm_a, 'team_building', 'ja');
            if not exists (
              select 1 from public.groups
              where slug = 'community-check'
                and category = 'team_building' and language = 'ja'
            ) then
              raise exception 'COMM-CHECK: the group tags did not save';
            end if;
            begin
              update public.groups set category = 'casual' where slug = 'community-check';
              raise exception 'COMM-CHECK: a bad group category was accepted';
            exception when check_violation then
              null;
            end;
            perform set_config('request.jwt.claims', json_build_object('sub', comm_b, 'role', 'authenticated')::text, true);
            if not exists (
              select 1 from public.groups
              where slug = 'community-check' and category = 'team_building'
            ) then
              raise exception 'COMM-CHECK: the group tags are not public';
            end if;
          end;
          $comm$;
          SQL

      - name: Stop
        if: always()
        run: supabase stop --no-backup
