apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// ---------------------------------------------------------------------------
// Release signing: the upload key never lives in the repo. android/
// keystore.properties (git-ignored) points at it; the owner creates the key
// and the file themselves (see android-signing.md in the Obsidian vault).
// Debug builds never need it; release builds fail with a clear message when
// the file is missing.
// ---------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// ---------------------------------------------------------------------------
// Versions: versionName follows package.json; versionCode is the single
// number Google Play requires to rise with every upload — bump it in
// android/version.properties before each store upload.
// ---------------------------------------------------------------------------
def packageJson = new JsonSlurper().parseText(rootProject.file("../package.json").text)
def versionPropsFile = rootProject.file("version.properties")
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (versionProps.getProperty("versionCode") ?: "1").toInteger()

android {
    namespace = "com.vuforge.ohkolab"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vuforge.ohkolab"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName packageJson.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Release tasks refuse to run without the keystore file, with a message that
// names it (instead of an obscure "keystore null" failure deep in the build).
tasks.register("requireReleaseKeystore") {
    doLast {
        if (!hasReleaseKeystore) {
            throw new GradleException(
                "android/keystore.properties is missing, so the release build cannot be signed. " +
                "Create the upload key and keystore.properties first - the owner's steps are in " +
                "android-signing.md in the Obsidian vault. (Debug builds work without it.)"
            )
        }
    }
}
tasks.configureEach { task ->
    if ((task.name == "bundleRelease" || task.name == "assembleRelease") && !hasReleaseKeystore) {
        task.dependsOn "requireReleaseKeystore"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
